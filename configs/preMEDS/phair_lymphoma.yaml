# @package _global_
# Full standalone PHAIR configuration aligned with the lymphoma pipeline.
# Keep this file explicit so its complete table and mapping coverage can be
# reviewed without following inheritance or YAML anchors.
defaults:
  - ../root_config@
  - _self_

logging:
  level: INFO
  path: ./outputs/logs

env: local
run_name: preMEDS_phair_lymphoma
chunksize: 10_000_000

test: false

paths:
  output: ${oc.env:EHR2MEDS_DATA}/preMEDS/PHAIR
  tables_dir: /storage/archive/UCPH/PHAIR/dhr/tables/parquet

write_file_type: parquet

subject_id_mapping:
  file: ${paths.tables_dir}/t_person.parquet
  subject_id_col: v_pnr
  mapping_id_col:

tables:
  t_psyk_diag:
    filename: ${paths.tables_dir}/t_psyk_diag.parquet
    columns:
      v_recnum: record_number
      c_diag:
      c_tildiag:
      c_diagtype:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_psyk_adm.parquet
        join_on: k_recnum
        target_columns:
          v_cpr: subject_id
          d_uddto: date_end
          v_udtime: hour_end
          d_inddto: date_start
          v_indtime: hour_start
          v_indminut: minute_start
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        hour: hour_start
        minute: minute_start
      end_timestamp:
        date: date_end
        hour: hour_end

  t_sksopr:
    filename: ${paths.tables_dir}/t_sksopr.parquet
    columns:
      v_recnum: record_number
      d_odto: date_start
      v_otime: hour_start
      v_ominut: minute_start
      c_opr:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_columns:
          v_cpr: subject_id
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        hour: hour_start
        minute: minute_start

  t_sksube:
    filename: ${paths.tables_dir}/t_sksube.parquet
    columns:
      v_recnum: record_number
      d_odto: date_start
      v_otime: hour_start
      v_ominut: minute_start
      c_opr:
      c_oprart:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_columns:
          v_cpr: subject_id
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        hour: hour_start
        minute: minute_start

  t_psyk_sksopr:
    filename: ${paths.tables_dir}/t_psyk_sksopr.parquet
    columns:
      v_recnum: record_number
      d_odto: date_start
      v_otime: hour_start
      v_ominut: minute_start
      c_opr:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_psyk_adm.parquet
        join_on: k_recnum
        target_columns:
          v_cpr: subject_id
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        hour: hour_start
        minute: minute_start

  t_psyk_sksube:
    filename: ${paths.tables_dir}/t_psyk_sksube.parquet
    columns:
      v_recnum: record_number
      d_odto: date_start
      v_otime: hour_start
      v_ominut: minute_start
      c_opr:
      c_oprart:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_psyk_adm.parquet
        join_on: k_recnum
        target_columns:
          v_cpr: subject_id
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        hour: hour_start
        minute: minute_start

  procedurer_andre:
    filename: ${paths.tables_dir}/procedurer_andre.parquet
    columns:
      dw_ek_kontakt: contact_id
      dato_start: date_start
      tidspunkt_start: time_start
      dato_slut: date_end
      tidspunkt_slut: time_end
      procedurekode:
      proceduretype:
      sorenhed_pro: sor_id
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter.parquet
        join_on: dw_ek_kontakt
        target_columns:
          cpr: subject_id
        drop_source: true
      - function: sor
        source_column: sor_id
        source_date_column: date_start
        via_file: sor2_contact_mapping.parquet
        join_on: sor_id
    normalize_integer_columns:
      - region
    value_map:
      date_end:
        '.': null
    timestamp_columns:
      start_timestamp:
        date: date_start
        time: time_start
      end_timestamp:
        date: date_end
        time: time_end

  procedurer_kirurgi:
    filename: ${paths.tables_dir}/procedurer_kirurgi.parquet
    columns:
      dw_ek_kontakt: contact_id
      dato_start: date_start
      tidspunkt_start: time_start
      dato_slut: date_end
      tidspunkt_slut: time_end
      procedurekode:
      #proceduretype: same prodecure for all these procedures, so we omit it
      sorenhed_pro: sor_id
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter.parquet
        join_on: dw_ek_kontakt
        target_columns:
          cpr: subject_id
        drop_source: true
    normalize_integer_columns:
      - region
    value_map:
      date_end:
        '.': null
    timestamp_columns:
      start_timestamp:
        date: date_start
        time: time_start
      end_timestamp:
        date: date_end
        time: time_end

  epikur:
    filename: ${paths.tables_dir}/epikur.parquet
    columns:
      cpr: subject_id
      eksd: date_start
      atc:
    timestamp_columns:
      start_timestamp:
        date: date_start

  indberetningmedpris:
    filename: ${paths.tables_dir}/indberetningmedpris.parquet
    columns:
      v_cpr: subject_id
      d_ord_start: date_start
      c_atc:
      c_patienttype:
      c_sor: sor_id
      v_adm_dosis: dosage
      v_styrke_num: strength
    mappings:
      - function: sor
        source_column: sor_id
        source_date_column: date_start
        via_file: sor2_contact_mapping.parquet
        join_on: sor_id
    normalize_integer_columns:
      - c_patienttype
      - region
    timestamp_columns:
      start_timestamp:
        date: date_start

  t_diag:
    filename: ${paths.tables_dir}/t_diag.parquet
    columns:
      v_recnum: record_number
      c_diag:
      c_tildiag:
      c_diagtype:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_columns:
          v_cpr: subject_id
          d_uddto: date_end
          v_udtime: hour_end
          d_inddto: date_start
          v_indtime: hour_start
          v_indminut: minute_start
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        hour: hour_start
        minute: minute_start
      end_timestamp:
        date: date_end
        hour: hour_end

  diagnoser:
    filename: ${paths.tables_dir}/diagnoser.parquet
    columns:
      dw_ek_kontakt: contact_id
      diagnosekode:
      diagnosetype:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter.parquet
        join_on: dw_ek_kontakt
        target_columns:
          cpr: subject_id
          dato_slut: date_end
          tidspunkt_slut: time_end
          dato_start: date_start
          tidspunkt_start: time_start
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        time: time_start
      end_timestamp:
        date: date_end
        time: time_end

  central_patient:
    filename: ${paths.tables_dir}/t_person.parquet
    columns:
      v_pnr: subject_id
      d_foddato: birthdate
      c_kon: sex
    mappings:
      - source_column: subject_id
        via_file: ${paths.tables_dir}/schemamortality.parquet
        join_on: k_cpr
        target_columns:
          deathdate: deathdate
        how: left

  kontakter:
    filename: ${paths.tables_dir}/kontakter.parquet
    columns:
      cpr: subject_id
      dato_start: date_start
      tidspunkt_start: time_start
      dato_slut: date_end
      tidspunkt_slut: time_end
      aktionsdiagnose:
      kontaktaarsag:
      prioritet:
      kontakttype:
      sorenhed_ans: sor_id
      dw_ek_kontakt: contact_id
    mappings:
      - function: sor
        source_column: sor_id
        source_date_column: date_start
        via_file: sor2_contact_mapping.parquet
        join_on: sor_id
    normalize_integer_columns:
      - region
    value_map:
      prioritet:
        1: "ATA1"
        2: "ATA3"
    timestamp_columns:
      start_timestamp:
        date: date_start
        time: time_start
      end_timestamp:
        date: date_end
        time: time_end

  t_adm:
    filename: ${paths.tables_dir}/t_adm.parquet
    columns:
      v_cpr: subject_id
      d_uddto: date_end
      v_udtime: hour_end
      d_inddto: date_start
      v_indtime: hour_start
      v_indminut: minute_start
      c_adiag:
      c_kontaars:
      c_pattype:
      c_indm: priority
      c_spec:
      c_sgh:
      k_recnum: contact_id
    normalize_integer_columns:
      - c_kontaars
      - c_pattype
      - c_spec
      - c_sgh
      - priority
    value_map:
      priority: # map emergency vs planned visits to LPR3
        1: "ATA1"
        2: "ATA3"
      c_kontaars:
        1: "ALCC01"
        2: "ALCC02"
        3: "ALCC03"
        4: "ALCC04"
        6: "ALCC90"
        7: "ALCC90"
        8: "ALCC90"
        9: "ALCC90"
    mappings:
      - source_column: c_spec
        via_file: c_spec_to_specialty.parquet
        how: left
        join_on: c_spec
        target_columns:
          specialty: c_spec
        drop_source: true
      - source_column: c_sgh
        via_file: shak_to_region.parquet
        how: left
        join_on: kode
        target_columns:
          region: c_sgh
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        hour: hour_start
        minute: minute_start
      end_timestamp:
        date: date_end
        hour: hour_end

  t_psyk_adm:
    filename: ${paths.tables_dir}/t_psyk_adm.parquet
    columns:
      v_cpr: subject_id
      d_inddto: date_start
      v_indtime: hour_start
      v_indminut: minute_start
      d_uddto: date_end
      v_udtime: hour_end
      c_adiag:
      c_kontaars:
      c_pattype:
      c_indm: priority
      c_spec:
      c_sgh:
      k_recnum: contact_id
    normalize_integer_columns:
      - c_kontaars
      - c_pattype
      - c_spec
      - c_sgh
      - priority
    value_map:
      priority: # map emergency vs planned visits to LPR3
        1: "ATA1"
        2: "ATA3"
      c_kontaars:
        1: "ALCC01"
        2: "ALCC02"
        3: "ALCC03"
        4: "ALCC04"
        6: "ALCC90"
        7: "ALCC90"
        8: "ALCC90"
        9: "ALCC90"
    mappings:
      - source_column: c_spec
        via_file: c_spec_to_specialty.parquet
        how: left
        join_on: c_spec
        target_columns:
          specialty: c_spec
        drop_source: true
      - source_column: c_sgh
        via_file: shak_to_region.parquet
        how: left
        join_on: kode
        target_columns:
          region: c_sgh
        drop_source: true
    timestamp_columns:
      start_timestamp:
        date: date_start
        hour: hour_start
        minute: minute_start
      end_timestamp:
        date: date_end
        hour: hour_end

  # This registry is part of data dilevery 1 and should be switched out for dimpatologiskdiagnose when data delivery 2 is available
  pato:
    filename: ${paths.tables_dir}/pato.parquet
    columns:
      v_cprnr: subject_id
      d_modtdato: date_start
      c_snomedkode:
      c_rekvafdsor: sor_id
    mappings:
      - function: sor
        source_column: sor_id
        source_date_column: date_start
        via_file: sor2_contact_mapping.parquet
        join_on: sor_id
    normalize_integer_columns:
      - region
    timestamp_columns:
      start_timestamp:
        date: date_start

  # This registry is part of data dilevery 1 and should be switched out for laboratorieproevesvar when data delivery 2 is available
  lab_forsker:
    filename: ${paths.tables_dir}/lab_forsker.parquet
    columns:
      patient_cpr: subject_id
      samplingdate: date_start
      samplingtime: time_start
      analysiscode:
      value:
    timestamp_columns:
      sample_timestamp:
        date: date_start
        time: time_start


