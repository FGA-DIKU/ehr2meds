# @package _global_
defaults: 
  - ../root_config@
  - _self_

logging:
  level: INFO
  path: ./outputs/logs


env: local
run_name: preMEDS_registers_only
chunksize: 1000000000

paths:
  output: ${oc.env:EHR2MEDS_DATA}/preMEDS/SDS
  tables_dir: ${oc.env:EHR2MEDS_DATA}/raw/registers   

write_file_type: parquet 

tables:
  patients_info:
    filename: ${paths.tables_dir}/CPMI_PatientInfo_with_datetime.parquet
    columns:
      patientid: subject_id
      Fødselsdato: birthdate
      Dødsdato: deathdate
      Køn: sex
  
  dimpatologiskdiagnose:
      filename: ${paths.tables_dir}/SDS_dimpatologiskdiagnose.parquet
      columns:
        dw_ek_rekvisition: contact_id
        diagnose_snomed_kode:
      mappings:
        - source_column: contact_id
          via_file: ${paths.tables_dir}/SDS_fctrekvisition.parquet
          join_on: dw_ek_rekvisition
          target_columns:
            patientid: subject_id
            datotid_modtagelse: null
            dato_modtagelse: null
            rekvirerende_afd_sor_kode: sor_id
          drop_source: true
        - function: sor
          source_column: sor_id
          source_date_column: dato_modtagelse
          via_file: sor2_contact_mapping.parquet
          join_on: sor_id
      normalize_integer_columns:
        - region

  diagnoser:
    filename: ${paths.tables_dir}/SDS_diagnoser.parquet               
    columns:
      dw_ek_kontakt: contact_id
      diagnosekode:
      diagnosetype: 
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet           
        join_on: dw_ek_kontakt
        target_columns:
          patientid: subject_id
          dato_start: date_start
          tidspunkt_start: time_start
          dato_slut: date_end
          tidspunkt_slut: time_end
        drop_source: true

  t_diag:
    filename: ${paths.tables_dir}/SDS_t_diag.parquet               
    columns:
      v_recnum: contact_id
      c_diag: 
      c_tildiag: 
      c_diagtype: 
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_columns:
          patientid: subject_id
          d_inddto: date_start
          d_uddto: date_end
          v_udtime: hour_end
          v_indtime: hour_start
          v_indminut: minute_start
        drop_source: true

  kontakter:
    filename: ${paths.tables_dir}/SDS_kontakter.parquet               
    columns:
      patientid: subject_id
      dato_start: date_start
      tidspunkt_start: time_start
      dato_slut: date_end
      tidspunkt_slut: time_end
      aktionsdiagnose:
      kontaktaarsag: 
      prioritet: 
      kontakttype: 
      sorenhed_ans: sor_id
      dw_ek_kontakt: contact_id
    mappings:
      - function: sor
        source_column: sor_id
        source_date_column: date_start
        via_file: sor2_contact_mapping.parquet
        join_on: sor_id
    normalize_integer_columns:
      - region
    value_map:
      # RC_PRIO has the same cross-generation issue for the two documented
      # legacy urgency values. Value 3 is not guessed or collapsed.
      prioritet:
        1: "ATA1"
        2: "ATA3"

  t_adm:
    filename: ${paths.tables_dir}/SDS_t_adm.parquet               
    columns:
      patientid: subject_id
      d_inddto: date_start
      d_uddto: date_end
      v_indtime: 
      v_indminut: 
      v_udtime:
      c_adiag:
      c_kontaars: 
      c_pattype:  
      c_indm: priority # NOTE: mapped to priority
      c_spec:
      c_sgh: 
      k_recnum: contact_id
    normalize_integer_columns:
      - c_kontaars
      - c_pattype
      - c_sgh
      - priority
    value_map:
      priority: # map emergency vs planned visits to LPR3
        1: "ATA1"
        2: "ATA3"
      c_kontaars:
        1: "ALCC01"
        2: "ALCC02"
        3: "ALCC03"
        4: "ALCC04"
        6: "ALCC90"
        7: "ALCC90"
        8: "ALCC90"
        9: "ALCC90"
    mappings:
    - source_column: c_spec
      via_file: c_spec_to_specialty.parquet
      how: left
      join_on: c_spec
      target_columns:
        specialty: c_spec
      drop_source: true
    - source_column: c_sgh   
      via_file: shak_to_region.parquet
      how: left
      join_on: kode
      target_columns:
        region: c_sgh
      drop_source: true

  t_sksopr:
    filename: ${paths.tables_dir}/SDS_t_sksopr.parquet   
    columns:
      v_recnum: contact_id
      d_odto: date_start
      v_otime: 
      v_ominut: 
      c_opr:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_columns:
          patientid: subject_id
        drop_source: true

  t_sksube:
    filename: ${paths.tables_dir}/SDS_t_sksube.parquet   
    columns:
      v_recnum: contact_id
      d_odto: date_start
      v_otime: 
      v_ominut: 
      c_opr:
      c_oprart:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_columns:
          patientid: subject_id
        drop_source: true

  procedurer_kirurgi:
    filename: ${paths.tables_dir}/SDS_procedurer_kirurgi.parquet      
    columns:
      dw_ek_kontakt: contact_id
      dato_start: date_start
      tidspunkt_start: time_start
      procedurekode:
      sorenhed_pro: sor_id
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_columns:
          patientid: subject_id
        drop_source: true
      - function: sor
        source_column: sor_id
        source_date_column: date_start
        via_file: sor2_contact_mapping.parquet
        join_on: sor_id
    normalize_integer_columns:
      - region

  procedurer_andre:
    filename: ${paths.tables_dir}/SDS_procedurer_andre.parquet        
    columns:
      dw_ek_kontakt: contact_id
      dato_start: date_start
      tidspunkt_start: time_start
      procedurekode:
      proceduretype:
      sorenhed_pro: sor_id
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_columns:
          patientid: subject_id
        drop_source: true
      - function: sor
        source_column: sor_id
        source_date_column: date_start
        via_file: sor2_contact_mapping.parquet
        join_on: sor_id
    normalize_integer_columns:
      - region

  ekokur:
    filename: ${paths.tables_dir}/SDS_ekokur.parquet                  
    columns:
      patientid: subject_id
      eksd: timestamp
      atc:

  indberetningmedpris:
    filename: ${paths.tables_dir}/SDS_indberetningmedpris.parquet
    columns:
      patientid: subject_id
      d_ord_start: timestamp
      c_atc:
      c_patienttype:  #NOTE; this overlaps with patienttype in LPR (contacts and t_adm)
      c_sor: sor_id
      v_adm_dosis: dosage # TODO: Currently not in use
      v_styrke_num: strength # TODO: Currently not in use
    mappings:
      - function: sor
        source_column: sor_id
        source_date_column: timestamp
        via_file: sor2_contact_mapping.parquet
        join_on: sor_id
    normalize_integer_columns:
      - c_patienttype
      - region
  laboratorieproevesvar:
    filename: ${paths.tables_dir}/SDS_laboratorieproevesvar.parquet
    columns:
      patientid: subject_id
      samplingdate: 
      samplingtime: 
      analysiscode:
      samplevalue:
