# @package _global_
defaults: 
  - ../root_config@
  - _self_

logging:
  level: INFO
  path: ./outputs/logs


env: local
run_name: preMEDS_registers_only
chunksize: 1000000000

paths:
  output: ${oc.env:EHR2MEDS_DATA}/preMEDS/SDS
  tables_dir: ${oc.env:EHR2MEDS_DATA}/raw/registers   

write_file_type: parquet 

tables:
  patients_info:
    filename: ${paths.tables_dir}/CPMI_PatientInfo_with_datetime.parquet
    columns:
      patientid: subject_id
      Fødselsdato: birthdate
      Dødsdato: deathdate
      Køn: sex
  
  dimpatologiskdiagnose:
      filename: ${paths.tables_dir}/SDS_dimpatologiskdiagnose.parquet
      columns:
        dw_ek_rekvisition: contact_id
        diagnose_snomed_kode:
      mappings:
        - source_column: contact_id
          via_file: ${paths.tables_dir}/SDS_fctrekvisition.parquet
          join_on: dw_ek_rekvisition
          target_column: patientid
          rename_to: subject_id
        - source_column: contact_id
          via_file: ${paths.tables_dir}/SDS_fctrekvisition.parquet
          join_on: dw_ek_rekvisition
          target_column: datotid_modtagelse 
          rename_to: timestamp
          drop_source: false
        - source_column: contact_id
          via_file: ${paths.tables_dir}/SDS_fctrekvisition.parquet
          join_on: dw_ek_rekvisition
          target_column: dato_modtagelse 
          rename_to: timestamp_fallback
          drop_source: true

  diagnoser:
    filename: ${paths.tables_dir}/SDS_diagnoser.parquet               
    columns:
      dw_ek_kontakt: contact_id
      diagnosekode:
      diagnosetype: 
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet           
        join_on: dw_ek_kontakt
        target_column: patientid
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_column: dato_slut
        rename_to: date_end
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_column: tidspunkt_slut
        rename_to: time_end
        drop_source: true

  t_diag:
    filename: ${paths.tables_dir}/SDS_t_diag.parquet               
    columns:
      v_recnum: contact_id
      c_diag: 
      c_tildiag: 
      c_diagtype: 
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_column: patientid
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_column: d_uddto
        rename_to: date_end
        drop_source: true

  kontakter:
    filename: ${paths.tables_dir}/SDS_kontakter.parquet               
    columns:
      patientid: subject_id
      dato_start: date_start
      tidspunkt_start: time_start
      dato_slut: date_end
      tidspunkt_slut: time_end
      aktionsdiagnose:
      kontaktaarsag: 
      prioritet: 
      kontakttype: 
      hovedspeciale_ans: 
      region_ans: 
      dw_ek_kontakt: contact_id
    normalize_integer_columns:
      - kontaktaarsag
      - prioritet
      - region_ans
    value_map:
      # Some LPR3 deliveries contain legacy two-digit specialty codes in the
      # otherwise textual field. Map them onto the same labels as c_spec.
      hovedspeciale_ans:
        0: "BLANDET MEDICIN OG KIRURGI"
        3: "HEPATOLOGI"
        4: "HÆMATOLOGI"
        14: "PALLIATIV MEDICIN"
        39: "SEXOLOGI"
        98: "FYSIO- OG ERGOTERAPI"
        99: null
      # LPR3 and legacy LPR share RC_REASON downstream. Normalize only the
      # documented ALCC equivalents; leave unfamiliar values untouched.
      kontaktaarsag:
        1: "ALCC01"
        2: "ALCC02"
        3: "ALCC03"
        4: "ALCC04"
        6: "ALCC90"
        7: "ALCC90"
        8: "ALCC90"
        9: "ALCC90"
      # RC_PRIO has the same cross-generation issue for the two documented
      # legacy urgency values. Value 3 is not guessed or collapsed.
      prioritet:
        1: "ATA1"
        2: "ATA3"

  t_adm:
    filename: ${paths.tables_dir}/SDS_t_adm.parquet               
    columns:
      patientid: subject_id
      d_inddto: date_start
      d_uddto: date_end
      v_indtime: 
      v_indminut: 
      c_adiag:
      c_kontaars: 
      c_pattype:  
      c_indm: priority # NOTE: mapped to priority
      c_spec: 
      c_sgh: 
      k_recnum: contact_id
    normalize_integer_columns:
      - c_kontaars
      - c_pattype
      - c_spec
      - c_sgh
      - priority
    value_map:
      c_spec:
        1: "INTERN MEDICIN"
        2: "GERIATRI"
        4: "HÆMATOLOGI"
        5: "INFEKTIONSMEDICIN"
        6: "KARDIOLOGI"
        7: "MEDICINSK ALLERGOLOGI"
        8: "ENDOKRINOLOGI"
        9: "MEDICINSK GASTROENTEROLOGI"
        10: "LUNGESYGDOMME"
        11: "NEFROLOGI"
        12: "REUMATOLOGI"
        15: "AKUTMEDICIN"
        18: "DERMATO-VENEROLOGI"
        20: "NEUROLOGI"
        22: "KLINISK ONKOLOGI"
        30: "KIRURGI"
        31: "KARKIRURGI"
        32: "KIRURGISK GASTROENTEROLOGI"
        33: "PLASTIKKIRURGI"
        34: "THORAXKIRURGI"
        35: "UROLOGI"
        38: "GYNÆKOLOGI OG OBSTETRIK"
        40: "NEUROKIRURGI"
        42: "ORTOPÆDISK KIRURGI"
        44: "OFTALMOLOGI"
        46: "OTO-RHINO-LARYNGOLOGI"
        48: "TAND-, MUND- OG KÆBEKIRURGI"
        50: "PSYKIATRI"
        52: "BØRNE- OG UNGDOMSPSYKIATRI"
        60: "KLINISK BIOKEMI"
        61: "KLINISK FYSIOLOGI OG NUKLEARMEDICIN"
        62: "KLINISK IMMUNOLOGI"
        63: "KLINISK MIKROBIOLOGI"
        64: "KLINISK NEUROFYSIOLOGI"
        66: "RADIOLOGI"
        67: "KLINISK FARMAKOLOGI"
        68: "KLINISK GENETIK"
        80: "PÆDIATRI"
        84: "ANÆSTESIOLOGI"
        86: "ARBEJDSMEDICIN"
        90: "ALMEN MEDICIN"
        91: "SAMFUNDSMEDICIN"
      priority: # map emergency vs planned visits to LPR3
        1: "ATA1"
        2: "ATA3"
      c_kontaars:
        1: "ALCC01"
        2: "ALCC02"
        3: "ALCC03"
        4: "ALCC04"
        6: "ALCC90"
        7: "ALCC90"
        8: "ALCC90"
        9: "ALCC90"
    mappings:
    - source_column: c_sgh   
      via_file: shak_to_region.parquet
      how: left
      join_on: kode
      target_column: region
      rename_to: c_sgh
      drop_source: true

  t_sksopr:
    filename: ${paths.tables_dir}/SDS_t_sksopr.parquet   
    columns:
      v_recnum: contact_id
      d_odto: date_start
      v_otime: 
      v_ominut: 
      c_opr:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_column: patientid
        rename_to: subject_id
        drop_source: true

  t_sksube:
    filename: ${paths.tables_dir}/SDS_t_sksube.parquet   
    columns:
      v_recnum: contact_id
      d_odto: date_start
      v_otime: 
      v_ominut: 
      c_opr:
      c_oprart:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_column: patientid
        rename_to: subject_id
        drop_source: true

  procedurer_kirurgi:
    filename: ${paths.tables_dir}/SDS_procedurer_kirurgi.parquet      
    columns:
      dw_ek_kontakt: contact_id
      dato_start: date_start
      tidspunkt_start: time_start
      procedurekode:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_column: patientid
        rename_to: subject_id
        drop_source: true

  procedurer_andre:
    filename: ${paths.tables_dir}/SDS_procedurer_andre.parquet        
    columns:
      dw_ek_kontakt: contact_id
      dato_start: date_start
      tidspunkt_start: time_start
      procedurekode:
      proceduretype:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_column: patientid
        rename_to: subject_id
        drop_source: true

  ekokur:
    filename: ${paths.tables_dir}/SDS_ekokur.parquet                  
    columns:
      patientid: subject_id
      eksd: timestamp
      atc:

  indberetningmedpris:
    filename: ${paths.tables_dir}/SDS_indberetningmedpris.parquet
    columns:
      patientid: subject_id
      d_ord_start: timestamp
      c_atc:
      c_patienttype:  #NOTE; this overlaps with patienttype in LPR (contacts and t_adm)
      k_region_id:
      v_adm_dosis: dosage # TODO: Currently not in use
      v_styrke_num: strength # TODO: Currently not in use
    normalize_integer_columns:
      - c_patienttype
      - k_region_id
  laboratorieproevesvar:
    filename: ${paths.tables_dir}/SDS_laboratorieproevesvar.parquet
    columns:
      patientid: subject_id
      samplingdate: 
      samplingtime: 
      analysiscode:
      samplevalue:
