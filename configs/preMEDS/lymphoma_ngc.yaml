# @package _global_
defaults: 
  - ../root_config@
  - _self_

logging:
  level: INFO
  path: ./outputs/logs


env: local
run_name: preMEDS_registers_only
chunksize: 1000000000

paths:
  output: ${oc.env:EHR2MEDS_DATA}/preMEDS/SDS
  tables_dir: ${oc.env:EHR2MEDS_DATA}/raw/registers   

write_file_type: parquet 

#subject_id_mapping:
#  file: # ${paths.tables_dir}/CPMI_PatientInfo.parquet # Table to derive mapping from (can be None)
#  subject_id_col: # patientid # Column to use as the subject_id mapping
#  mapping_id_col: # Column to use as the mapping (can be None, then auto-generated)

tables:
  patients_info:
    filename: ${paths.tables_dir}/CPMI_PatientInfo_with_datetime.parquet
    columns:
      patientid: subject_id
      Fødselsdato: birthdate
      Dødsdato: deathdate
      Køn: gender
  
  SDS_dimpatologiskdiagnose:
      filename: ${paths.tables_dir}/SDS_dimpatologiskdiagnose.parquet
      columns:
        dw_ek_rekvisition: contact_id
        diagnose_snomed_kode:
      mappings:
        - source_column: contact_id
          via_file: ${paths.tables_dir}/SDS_fctrekvisition.parquet
          join_on: dw_ek_rekvisition
          target_column: patientid
          rename_to: subject_id
        - source_column: contact_id
          via_file: ${paths.tables_dir}/SDS_fctrekvisition.parquet
          join_on: dw_ek_rekvisition
          target_column: datotid_modtagelse 
          rename_to: timestamp
          drop_source: false
        - source_column: contact_id
          via_file: ${paths.tables_dir}/SDS_fctrekvisition.parquet
          join_on: dw_ek_rekvisition
          target_column: dato_modtagelse 
          rename_to: timestamp_fallback
          drop_source: true

  SDS_diagnoser:
    filename: ${paths.tables_dir}/SDS_diagnoser.parquet               
    columns:
      dw_ek_kontakt: contact_id
      diagnosekode:
      diagnosetype: 
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet           
        join_on: dw_ek_kontakt
        target_column: patientid
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_column: dato_slut      
        rename_to: date_end
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_column: tidspunkt_slut      
        rename_to: time_end
        drop_source: true

  SDS_t_diag:
    filename: ${paths.tables_dir}/SDS_t_diag.parquet               
    columns:
      v_recnum: contact_id
      c_diag: 
      c_tildiag: 
      c_diagtype: 
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_column: patientid
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_column: d_uddto 
        rename_to: timestamp
        drop_source: true

  SDS_kontakter:
    filename: ${paths.tables_dir}/SDS_kontakter.parquet               
    columns:
      patientid: subject_id
      dato_start: date_start
      tidspunkt_start: time_start
      aktionsdiagnose:
      kontaktaarsag: 
      prioritet: 
      kontakttype: 
      hovedspeciale_ans: 
      region_ans: 
      dw_ek_kontakt: contact_id

  SDS_t_adm:
    filename: ${paths.tables_dir}/SDS_t_adm.parquet               
    columns:
      patientid: subject_id
      d_inddto: date_start
      v_indtime: 
      v_indminut: 
      c_adiag:
      c_kontaars: 
      c_pattype:  
      c_indm: priority # NOTE: mapped to priority
      c_spec: 
      c_sgh: 
      k_recnum: contact_id
    # compose:
    #   time_start:
    #     columns: [v_indtime, v_indminut]
    #     separator: ":"
    value_map:
      c_spec:
        "01": "intern medicin"
        "02": "geriatri"
        "04": "hæmatologi"
        "05": "infektionsmedicin"
        "06": "kardiologi"
        "07": "medicinsk allergologi"
        "08": "endokrinologi"
        "09": "medicinsk gastroenterologi"
        "10": "lungesygdomme"
        "11": "nefrologi"
        "12": "reumatologi"
        "15": "akutmedicin"
        "18": "dermato-venerologi"
        "20": "neurologi"
        "22": "klinisk onkologi"
        "30": "kirurgi"
        "31": "karkirurgi"
        "32": "kirurgisk gastroenterologi"
        "33": "plastikkirurgi"
        "34": "thoraxkirurgi"
        "35": "urologi"
        "38": "gynækologi og obstetrik"
        "40": "neurokirurgi"
        "42": "ortopædisk kirurgi"
        "44": "oftalmologi"
        "46": "oto-rhino-laryngologi"
        "48": "tand-, mund- og kæbekirurgi"
        "50": "psykiatri"
        "52": "børne- og ungdomspsykiatri"
        "60": "klinisk biokemi"
        "61": "klinisk fysiologi og nuklearmedicin"
        "62": "klinisk immunologi"
        "63": "klinisk mikrobiologi"
        "64": "klinisk neurofysiologi"
        "66": "radiologi"
        "67": "klinisk farmakologi"
        "68": "klinisk genetik"
        "80": "pædiatri"
        "84": "anæstesiologi"
        "86": "arbejdsmedicin"
        "90": "almen medicin"
        "91": "samfundsmedicin"
      priority: # map emergency vs planned visits to LPR3
        "1": "ATA1"
        "2": "ATA3"
      c_kontaars:
        "1": "ALCC01"
        "2": "ALCC02"
        "3": "ALCC03"
        "4": "ALCC04"
        "6": "ALCC90"
        "7": "ALCC90"
        "8": "ALCC90"
        "9": "ALCC90"
    mappings:
    - source_column: c_sgh   
      via_file: ${paths.tables_dir}/shak_to_region.parquet # using resources
      join_on: kode
      target_column: region
      rename_to: c_sgh
      drop_source: true

  SDS_t_sksopr:
    filename: ${paths.tables_dir}/SDS_t_sksopr.parquet   
    columns:
      v_recnum: contact_id
      d_odto: date_start
      v_otime: 
      v_ominut: 
      c_opr:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_column: patientid
        rename_to: subject_id
        drop_source: true
    # compose:
    #   time_start:
    #     columns: [v_otime, v_ominut]
    #     separator: ":"

  SDS_t_sksube:
    filename: ${paths.tables_dir}/SDS_t_sksube.parquet   
    columns:
      v_recnum: contact_id
      d_odto: date_start
      v_otime: 
      v_ominut: 
      c_opr:
      c_oprart:  # TODO: Currently not in use
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_t_adm.parquet
        join_on: k_recnum
        target_column: patientid
        rename_to: subject_id
        drop_source: true
    # compose:
    #   time_start:
    #     columns: [v_otime, v_ominut]
    #     separator: ":"

  SDS_procedurer_kirurgi:
    filename: ${paths.tables_dir}/SDS_procedurer_kirurgi.parquet      
    columns:
      dw_ek_kontakt: contact_id
      dato_start: date_start
      tidspunkt_start: time_start
      procedurekode:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_column: patientid
        rename_to: subject_id
        drop_source: true

  SDS_procedurer_andre:
    filename: ${paths.tables_dir}/SDS_procedurer_andre.parquet        
    columns:
      dw_ek_kontakt: contact_id
      dato_start: date_start
      tidspunkt_start: time_start
      procedurekode:
      proceduretype: # TODO: Currently not in use
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS_kontakter.parquet
        join_on: dw_ek_kontakt
        target_column: patientid
        rename_to: subject_id
        drop_source: true

  SDS_ekokur:
    filename: ${paths.tables_dir}/SDS_ekokur.parquet                  
    columns:
      patientid: subject_id
      eksd: timestamp
      atc:

  SDS_indberetningmedpris:
    filename: ${paths.tables_dir}/SDS_indberetningmedpris.parquet
    columns:
      patientid: subject_id
      d_ord_start: timestamp
      c_atc:
      c_patienttype:  #NOTE; this overlaps with patienttype in LPR (contacts and t_adm)
      v_adm_dosis: dosage # TODO: Currently not in use
      v_styrke_num: strength # TODO: Currently not in use

  SDS_laboratorieproevesvar:
    filename: ${paths.tables_dir}/SDS_laboratorieproevesvar.parquet
    columns:
      patientid: subject_id
      samplingdate: 
      samplingtime: 
      analysiscode:
      samplevalue: 