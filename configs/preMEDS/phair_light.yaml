# @package _global_
defaults:
  - ../root_config@
  - _self_

logging:
  level: INFO
  path: ./outputs/logs

env: local
run_name: preMEDS_phair_light
chunksize: 10_000_000

test: false

paths:
  output: ${oc.env:EHR2MEDS_DATA}/preMEDS/PHAIR_light
  tables_dir: /storage/archive/UCPH/PHAIR/dhr/tables/parquet
  #file_type: parquet

write_file_type: parquet

subject_id_mapping:
  file: ${paths.tables_dir}/t_person.parquet
  subject_id_col: v_pnr
  mapping_id_col:

tables:
  t_psyk_diag:
    filename: ${paths.tables_dir}/t_psyk_diag.parquet
    columns:
      v_recnum: record_number
      c_diag:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_psyk_adm.parquet
        join_on: k_recnum
        target_column: v_cpr
        rename_to: subject_id
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_psyk_adm.parquet
        join_on: k_recnum
        target_column: d_inddto
        rename_to: date_start
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_psyk_adm.parquet
        join_on: k_recnum
        target_column: v_indtime
        rename_to: hour_start
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_psyk_adm.parquet
        join_on: k_recnum
        target_column: v_indminut
        rename_to: minute_start
        drop_source: true  
  
  t_sksopr:
    filename: ${paths.tables_dir}/t_sksopr.parquet
    columns:
      v_recnum: record_number
      c_opr:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_column: v_cpr
        rename_to: subject_id
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_column: d_inddto
        rename_to: date_start
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_column: v_indtime
        rename_to: hour_start
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_column: v_indminut
        rename_to: minute_start
        drop_source: true
      
  t_sksube:
    filename: ${paths.tables_dir}/t_sksube.parquet
    columns:
      v_recnum: record_number
      c_opr:
    mappings:
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_column: v_cpr
        rename_to: subject_id
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_column: d_inddto
        rename_to: date_start
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_column: v_indtime
        rename_to: hour_start
      - source_column: record_number
        via_file: ${paths.tables_dir}/t_adm.parquet
        join_on: k_recnum
        target_column: v_indminut
        rename_to: minute_start
        drop_source: true

  t_psyk_sksopr:
    filename: ${paths.tables_dir}/t_psyk_sksopr.parquet
    columns:
      v_recnum: record_number
      c_opr:
    mappings:
      - source_column: record_number
