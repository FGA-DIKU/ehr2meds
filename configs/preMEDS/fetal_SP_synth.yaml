# @package _global_
defaults: 
  - ../root_config@
  - _self_

test: false # Just for testing, use false for full conversion

chunksize: 100_000 # Just for testing, use around 250_000_000 for full conversion with CPU-20-LP

align_timestamps: # removes information that is not in the global format
  names: [timestamp]
  format: "%Y-%m-%d %H:%M:%S.%f"

paths:
  concepts: ${oc.env:EHR2MEDS_DATA}/SP/tables
  output: ../data/preMEDS/fetal_data/SP/dmpl

write_file_type: csv
subject_id_mapping:
  file: ${paths.tables_dir}/patient_info.csv # Table to derive mapping from (can be None)
  subject_id_col: CPR # Column to use as the subject_id mapping
  mapping_id_col: # Column to use as the mapping (can be None, then auto-generated)

concepts:
  admissions:
    filename: Mor - CPMI - ADT hændelser.csv
    rename_columns:
      MOR_CPR: subject_id
      Flyt_ind: timestamp_in
      Flyt_ud: timestamp_out
      Afsnit: section
      ADT_haendelse: type
    melt_table:
      - target_name: timestamp
        source_cols: [timestamp_in, timestamp_out]
        prefix_col: code
        prefix_map: {timestamp_in: IN/, timestamp_out: OUT/}

  labtest:
    filename: ${paths.tables_dir}/labtest.asc
    rename_columns:
      BestOrd: code
      Bestillingsdato: timestamp
      CPR: subject_id
      Resultatværdi: numeric_value
    # file_info:
    #   sep: "|"
    #   encoding: "latin1"

  SDS_diagnoser:
    filename: ${paths.tables_dir}/diagnoser.csv               
    rename_columns:
      diagnosekode: code
      diagnose_type: diagnosetype
      contact_id_new: contact_id
    code_prefix: "RD/"
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter.csv           
        join_on: contact_id
        target_column: person_id
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter.csv
        join_on: contact_id
        target_column: dato_slut      
        rename_to: timestamp
        drop_source: true
    unroll_columns:
      - column: diagnosetype
        prefix: "RD_TYPE/"

  patients_info:
    filename: ${paths.tables_dir}/patient_info.csv
    rename_columns:
      CPR: subject_id
      Birthdate: birthdate
      Deathdate: deathdate
      Gender: gender
