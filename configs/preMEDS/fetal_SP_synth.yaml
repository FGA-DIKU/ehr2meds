# @package _global_
defaults: 
  - ../root_config@
  - _self_


chunksize: 500000

paths:
  tables_dir: ${oc.env:EHR2MEDS_DATA}/raw/fetal_data/SDS_AND_SP_from_population  
  output: ${oc.env:EHR2MEDS_DATA}/preMEDS/fetal_data/SP

write_file_type: csv
subject_id_mapping:
  file: ${paths.tables_dir}/Mor - CPMI - Patientinfo.csv # Table to derive mapping from (can be None)
  subject_id_col: MOR_CPR # Column to use as the subject_id mapping
  mapping_id_col: # Column to use as the mapping (can be None, then auto-generated)

tables:
  diagnosis:
    filename: ${paths.tables_dir}/Mor - CPMI - Diagnoseliste.csv
    columns:
      MOR_CPR: subject_id
      Redigeringsdato: timestamp
      Diagnosekode:

  procedure:
    filename: ${paths.tables_dir}/Mor - CPMI - Procedurer.csv
    columns:
      MOR_CPR: subject_id
      ServiceDate: timestamp
      ProcedureCode:

  admissions:
    filename: ${paths.tables_dir}/Mor - CPMI - ADT hændelser.csv
    columns:
      MOR_CPR: subject_id
      Flyt_ind: timestamp_in
      Flyt_ud: timestamp_out
      Afsnit:

  labtest:
    filename: ${paths.tables_dir}/Mor - CPMI - Prøvesvar.csv
    columns:
      MOR_CPR: subject_id
      Prøvetagningstidspunkt: timestamp
      BestOrd:
      Resultatværdi: samplevalue

  SDS_diagnoser:
    filename: ${paths.tables_dir}/diagnoser.csv               
    columns:
      dw_ek_kontakt: contact_id
      diagnosekode:
      diagnosetype:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter_all.csv           
        join_on: dw_ek_kontakt
        target_column: cpr
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter_all.csv
        join_on: dw_ek_kontakt
        target_column: dato_slut      
        rename_to: timestamp
        drop_source: true

  patients_info:
    filename: ${paths.tables_dir}/Mor - CPMI - Patientinfo.csv
    columns:
      MOR_CPR: subject_id
      Fødselsdato: Birthdate
      Dødsdato: Deathdate
      Køn: Gender
