# @package _global_
defaults: 
  - ../root_config@
  - _self_


chunksize: 500000

paths:
  tables_dir: ${oc.env:EHR2MEDS_DATA}/raw/fetal_data/SDS_AND_SP_from_population  
  output: ${oc.env:EHR2MEDS_DATA}/preMEDS/fetal_data/SP

write_file_type: csv
subject_id_mapping:
  file: ${paths.tables_dir}/patient_info.csv # Table to derive mapping from (can be None)
  subject_id_col: CPR # Column to use as the subject_id mapping
  mapping_id_col: # Column to use as the mapping (can be None, then auto-generated)

tables:
  diagnosis:
    filename: ${paths.tables_dir}/diagnosis.csv
    columns:
      CPR: subject_id
      Redigeringsdato: timestamp
      Diagnosekode:

  procedure:
    filename: ${paths.tables_dir}/procedure.csv
    columns:
      CPR: subject_id
      Redigeringsdato: timestamp
      Procedurekode:

  admissions:
    filename: ${paths.tables_dir}/admissions.csv
    columns:
      CPR: subject_id
      Flyt_ind: timestamp_in
      Flyt_ud: timestamp_out
      Afsnit:

  labtest:
    filename: ${paths.tables_dir}/labtest.asc
    columns:
      CPR: subject_id
      Bestillingsdato: timestamp
      BestOrd:
      Resultatværdi: numeric_value

  SDS_diagnoser:
    filename: ${paths.tables_dir}/diagnoser.csv               
    columns:
      contact_id_new: contact_id
      diagnosekode:
      diagnose_type:
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter.csv           
        join_on: contact_id
        target_column: person_id
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/kontakter.csv
        join_on: contact_id
        target_column: dato_slut      
        rename_to: timestamp
        drop_source: true

  patients_info:
    filename: ${paths.tables_dir}/patient_info.csv
    columns:
      CPR: subject_id
      Birthdate:
      Deathdate:
      Gender:
