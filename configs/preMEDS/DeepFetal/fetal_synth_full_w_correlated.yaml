# @package _global_
defaults: 
  - /root_config@
  - fetal_ngc_full@
  - _self_

chunksize: 500000

paths:
  SDS_tables_dir: ${oc.env:EHR2MEDS_DATA}/raw/fetal_data/SDS_AND_SP_from_population  
  SP_tables_dir: ${oc.env:EHR2MEDS_DATA}/raw/fetal_data/SDS_AND_SP_from_population  
  output: ${hydra:run.dir}

write_file_type: csv
subject_id_mapping:
  file: ${paths.SP_tables_dir}/Population.csv # Table to derive mapping from (can be None)
  subject_id_col: MOR_CPR # Column to use as the subject_id mapping
  mapping_id_col: # Column to use as the mapping (can be None, then auto-generated)


tables:
  patients_info:
    filename: ${paths.SP_tables_dir}/Mor - CPMI - Patientinfo.csv
    columns:
      MOR_CPR: subject_id
      Fødselsdato: birthdate
      Dødsdato: deathdate
      Køn: gender

  synthetic_diagnostic_data:
    filename: ${paths.SDS_tables_dir}/synthetic_diagnostic_data.csv               
    columns:
      CPR: subject_id
      diagnostic_label: diagnosekode
      timestamp: 

  synthetic_lab_data:
    filename: ${paths.SDS_tables_dir}/synthetic_lab_data.csv               
    columns:
      CPR: subject_id
      lab_name: 
      lab_value: 
      timestamp: 