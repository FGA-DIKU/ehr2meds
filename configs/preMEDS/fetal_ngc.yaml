# @package _global_
defaults: 
  - ../root_config@
  - _self_

logging:
  level: INFO
  path: ./outputs/logs

hydra:
  run:
    dir: ./outputs/hydra/fetal_ngc
  output_subdir: hydra

env: local
run_name: preMEDS_SP_and_SDS
chunksize: 10000

paths:
  output: /users/data/UCPH/DeepFetal/projects/preterm_EHR/data/test_preMEDS/fetal_data/SDS_SP/dmpl_test/
  tables_dir: ${oc.env:EHR2MEDS_DATA}/    

write_file_type: csv 

test: true

subject_id_mapping:
  file: /users/data/UCPH/DeepFetal/projects/preterm_EHR/data/full_population.csv # Table to derive mapping from (can be None)
  subject_id_col: m_cpr # Column to use as the subject_id mapping
  mapping_id_col: # Column to use as the mapping (can be None, then auto-generated)

tables:
  # TODO Add smoking status
  patients_info:
    filename: ${paths.tables_dir}/SP/tables/Mor - CPMI - Patientinfo.csv
    columns:
      MOR_CPR: subject_id
      Fødselsdato: birthdate
      Dødsdato: deathdate
      Køn: gender

  admissions:
    filename: ${paths.tables_dir}/SP/tables/Mor - CPMI - ADT hændelser.csv
    columns:
      MOR_CPR: subject_id
      Flyt_ind: 
      Flyt_ud: 
      Afsnit: 

  diagnosis:
    filename: ${paths.tables_dir}/SP/tables/Mor - CPMI - Diagnoseliste.csv
    columns:
      MOR_CPR: subject_id
      Redigeringsdato: timestamp
      Diagnosekode:
      Diagnose:

  procedure:
    filename: ${paths.tables_dir}/SP/tables/Mor - CPMI - Procedurer.csv
    columns:
      MOR_CPR: subject_id
      ServiceDate: timestamp
      ProcedureCode:

  medication:
    filename: ${paths.tables_dir}/SP/tables/Mor - CPMI - Medicin.csv
    columns:
      MOR_CPR: subject_id
      Administrationstidspunkt: timestamp
      Bestillingsdato: fill_timestamp
      ATC:

  # TODO Add lab values
  labtest:
    filename: ${paths.tables_dir}/SP/tables/Mor - CPMI - Prøvesvar.csv
    columns:
      MOR_CPR: subject_id
      Prøvetagningstidspunkt: timestamp
      BestOrd:
      Resultatværdi: lab_result

  SDS_diagnoser:
    filename: ${paths.tables_dir}/SDS/registers_pseudonymized/diagnoser.csv               
    columns:
      dw_ek_kontakt: contact_id
      diagnosekode:
      diagnosetype: 
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS/registers_pseudonymized/kontakter_all.csv           
        join_on: dw_ek_kontakt
        target_column: cpr
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS/registers_pseudonymized/kontakter_all.csv
        join_on: dw_ek_kontakt
        target_column: dato_slut      
        rename_to: 
        drop_source: true

  SDS_t_diag:
    filename: ${paths.tables_dir}/SDS/registers_pseudonymized/t_diag.csv               
    columns:
      V_RECNUM: contact_id
      C_DIAG: 
      C_TILDIAG: 
      C_DIAGTYPE: 
    mappings:
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS/registers_pseudonymized/t_adm.csv
        join_on: K_RECNUM
        target_column: V_CPR
        rename_to: subject_id
      - source_column: contact_id
        via_file: ${paths.tables_dir}/SDS/registers_pseudonymized/t_adm.csv
        join_on: K_RECNUM
        target_column: D_UDDTO 
        rename_to: 
        drop_source: true

