minimum_count: 100
mapping_output_filepath: null
# Defaults to <mapping_output_filepath>.summary.json.
mapping_summary_output_filepath: null
mapping_filepath: null
external_mapping_mode: overlay

# Only namespace routing normally needs configuration; the level widths for
# each profile are defined below under `hierarchies`.
namespaces:
  RD: sks_diagnosis
  RC: sks_diagnosis
  RC_ADM: sks_diagnosis
  RPS: sks_operation
  RPO: sks_other_procedure
  RM: atc
  RMA: atc

# Character-position level widths per code system. A pipeline config can
# override any single field of a profile (e.g. `hierarchies: {atc: {levels:
# [...]}}`) without repeating the rest, or add a wholly new profile name.
#
# Level 1 (the bare chapter letter) is deliberately excluded from the SKS
# profiles: ICD-10/SKS chapter boundaries don't align with the leading
# letter (e.g. "D" spans both the tail of chapter II, neoplasms, and all of
# chapter III, blood disorders), so it would merge clinically unrelated
# codes. ATC's level 1 is a real, official top-level tier (the 14 anatomical
# main groups), so it's kept. An override that reintroduces level 1 for a
# SKS profile is not blocked -- it takes effect exactly as configured.
hierarchies:
  sks_diagnosis:
    levels: [4, 3, 2]
  sks_operation:
    levels: [7, 6, 5, 4, 3, 2]
  sks_other_procedure:
    levels: [8, 7, 6, 5, 4, 3, 2]
  atc:
    levels: [1, 3, 4, 5, 7]
