# This registry is part of data dilevery 1 and should be switched out for dimpatologiskdiagnose when data delivery 2 is available
pato:
  pathology:
    code: f"PATHOLOGY//{$c_snomedkode}"
    time: $start_timestamp
  clinical_specialty:
    code: f"CONTACT_SPECIALTY//{$specialty}"
    time: $start_timestamp
  region_code:
    code: f"REGION//{$region}"
    time: $start_timestamp
  
# This registry is part of data dilevery 1 and should be switched out for laboratorieproevesvar when data delivery 2 is available
laboratorieproevesvar:
  lab_test:
    code: f"LABTEST//{$analysiscode}"
    time: $sample_timestamp
    numeric_value: '(extract group 1 of /^\s*([-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?)\s*$/ from $samplevalue) as float64'  # Regex to extract numeric value from string, allowing for scientific notation and whitespace
    text_value: "$value" # the value as string, for cases where the value is not numeric (e.g., "NEG", "POS", "<0.1", etc.). Duplicates where text and numeric are the same are dropped.

