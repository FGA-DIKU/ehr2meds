# Full standalone PHAIR event configuration.
# Definitions are intentionally explicit; no YAML anchors are used.
subject_id_col: subject_id
central_patient:
  dob:
    code: DOB
    time: $birthdate
  dod:
    code: DOD
    time: $deathdate
  sex:
    code: f"SEX//{$sex}"
    time: null
dimpatologiskdiagnose:
  pathology:
    code: f"PATHOLOGY//{$diagnose_snomed_kode}"
    time: coalesce($datotid_modtagelse as '%Y-%m-%dT%H:%M:%S', ($dato_modtagelse as '%Y-%m-%d')
      as datetime)
diagnoser:
  diagnosis:
    code: f"DIAGNOSIS//{$diagnosekode}"
    time: coalesce($end_timestamp, $start_timestamp)
  diagnosis_type:
    code: f"DIAGNOSIS_TYPE//{$diagnosetype}"
    time: coalesce($end_timestamp, $start_timestamp)
