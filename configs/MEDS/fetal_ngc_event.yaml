# LPR3 contacts
SDS_kontakter:
  aktionsdiagnose:
    code: f"RC//{$aktionsdiagnose}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S')
  contact_reason:
    code: f"RC_REASON//{$kontaktaarsag}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S')
  priority:
    code: f"RC_PRIO//{$priority}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S')
  contact_type:
    code: f"RC_TYPE//{$contact_type}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S')
  clinical_specialty:
    code: f"RC_SPEC//{$hovedspeciale_ans}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S')
  region_code:
    code: f"RC_REG//{$region_ans}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S')

# LPR admissions
SDS_t_adm:
  SDS_t_adm:
    code: f"RC_ADM//{$C_ADIAG}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{$V_INDTIME}:{$V_INDMINUT}" as '%H:%M')
  contact_reason:
    code: f"RC_REASON//{$C_KONTAARS}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{$V_INDTIME}:{$V_INDMINUT}" as '%H:%M')
  patient_type:
    code: f"RC_ADM_TYPE//{$C_PATTYPE}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{$V_INDTIME}:{$V_INDMINUT}" as '%H:%M')
  priority:
    code: f"RC_PRIO//{$priority}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{$V_INDTIME}:{$V_INDMINUT}" as '%H:%M')
  clinical_specialty:
    code: f"RC_SPEC//{$C_SPEC}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{$V_INDTIME}:{$V_INDMINUT}" as '%H:%M')
  hospital_code:
    code: f"RC_SGH//{$C_SGH}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{$V_INDTIME}:{$V_INDMINUT}" as '%H:%M')

