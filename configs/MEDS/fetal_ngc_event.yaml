subject_id_col: subject_id

# Patient demographics (patients_info)
subject:
  subject_id_col: subject_id
  dob:
    code:
      - DOB
    time: col(birthdate)
    time_format: "%Y-%m-%d"
  dod:
    code:
      - DOD
    time: col(deathdate)
    time_format: "%Y-%m-%d"
  gender:
    code:
      - GENDER
      - col(gender)
    time: null

# SP concepts (concepts)
admissions:
  IN:
    code: f"IN//{$Afsnit}"
    time: $timestamp_in as "%Y-%m-%d %H:%M:%S%.f"
  OUT:
    code: f"OUT//{$Afsnit}"
    time: $timestamp_out as "%Y-%m-%d %H:%M:%S%.f"
    

diagnosis:
  diagnosis:
    code: f"D//{$code}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"

procedure:
  procedure:
    code: f"P//{$code}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"

medication:
  medication:
    code: f"M//{$code}"
    time: coalesce($timestamp as '%Y-%m-%d %H:%M:%S.%f', $fill_timestamp as '%Y-%m-%d %H:%M:%S.%f')

labtest:
  labtest:
    code: f"LAB//{$code}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"
    numeric_value: col(numeric_value)

# Register concepts (register_concepts)
# LPR3 diagnoses (unrolled diagnosetype → RD_TYPE/…)
SDS_diagnoser:
  SDS_diagnoser:
    code: f"RD//{$code}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"
  diagnose_type:
    code: f"RD_TYPE//{$diagnosetype}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"

# LPR diagnoses (unrolled c_diagtype, c_tildiag, c_diag)
SDS_t_diag:
  SDS_t_diag:
    code: f"RD//{$code}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"
  diag_type:
    code: f"RD_TYPE//{$c_diagtype}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"
  tildiag:
    code: f"RD//{$c_tildiag}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"
  diag:
    code: f"RD//{$c_diag}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"

# LPR3 contacts (unrolled contact metadata)
SDS_kontakter:
  SDS_kontakter:
    code: f"RC//{$code}"
    time: set_time($date_start as '%Y-%m-%d', $time_start as '%H:%M:%S')
  contact_reason:
    code: f"RC_REASON//{$contact_reason}"
    time: set_time($date_start as '%Y-%m-%d', $time_start as '%H:%M:%S')
  priority:
    code: f"RC_PRIO//{$priority}"
    time: set_time($date_start as '%Y-%m-%d', $time_start as '%H:%M:%S')
  contact_type:
    code: f"RC_TYPE//{$contact_type}"
    time: set_time($date_start as '%Y-%m-%d', $time_start as '%H:%M:%S')
  clinical_specialty:
    code: f"RC_SPEC//{$clinical_specialty}"
    time: set_time($date_start as '%Y-%m-%d', $time_start as '%H:%M:%S')
  region_code:
    code: f"RC_REG//{$region_code}"
    time: set_time($date_start as '%Y-%m-%d', $time_start as '%H:%M:%S')

# LPR admissions (unrolled admission metadata)
SDS_t_adm:
  SDS_t_adm:
    code: f"RC_ADM//{$code}"
    time: set_time($date_start as '%Y-%m-%d', $v_indtime as '%H', $v_indminut as '%M')
  contact_reason:
    code: f"RC_REASON//{$contact_reason}"
    time: set_time($date_start as '%Y-%m-%d', $v_indtime as '%H', $v_indminut as '%M')
  patient_type:
    code: f"RC_ADM_TYPE//{$patient_type}"
    time: set_time($date_start as '%Y-%m-%d', $v_indtime as '%H', $v_indminut as '%M')
  priority:
    code: f"RC_PRIO//{$priority}"
    time: set_time($date_start as '%Y-%m-%d', $v_indtime as '%H', $v_indminut as '%M')
  clinical_specialty:
    code: f"RC_SPEC//{$clinical_specialty}"
    time: set_time($date_start as '%Y-%m-%d', $v_indtime as '%H', $v_indminut as '%M')
  hospital_code:
    code: f"RC_SGH//{$hospital_code}"
    time: set_time($date_start as '%Y-%m-%d', $v_indtime as '%H', $v_indminut as '%M')

# LPR surgical procedures
SDS_t_sksopr:
  SDS_t_sksopr:
    code: f"RPS//{$code}"
    time: set_time($date_start as '%Y-%m-%d', $v_otime as '%H', $v_ominut as '%M')

# LPR other procedures
SDS_t_sksube:
  SDS_t_sksube:
    code: f"RPO//{$code}"
    time: set_time($date_start as '%Y-%m-%d', $v_otime as '%H', $v_ominut as '%M')

# LPR3 surgical procedures
SDS_procedurer_kirurgi:
  SDS_procedurer_kirurgi:
    code: f"RPS//{$code}"
    time: set_time($date_start as '%Y-%m-%d', $time_start as '%H:%M:%S')

# LPR3 other procedures
SDS_procedurer_andre:
  SDS_procedurer_andre:
    code: f"RPO//{$code}"
    time: set_time($date_start as '%Y-%m-%d', $time_start as '%H:%M:%S')

# Medication
SDS_ekokur:
  SDS_ekokur:
    code: f"RM//{$code}"
    time: col(timestamp)
    time_format: "%Y-%m-%d %H:%M:%S.%f"

# NOTE: numeric_value is normalized before this step
SDS_laboratorieproevesvar:
  SDS_laboratorieproevesvar:
    code: f"L//{$code}"
    time: set_time($samplingdate as '%Y-%m-%d', $samplingtime as '%H:%M:%S')
    numeric_value: $numeric_value