subject_id_col: subject_id

# Patient demographics (patients_info)
patients_info:
  dob:
    code: "DOB"
    time: $birthdate as "%Y-%m-%d %H:%M:%S.%f"
  dod:
    code: "DOD"
    time: $deathdate as "%Y-%m-%d %H:%M:%S.%f"
  gender:
    code: f"GENDER//{$gender}"
    time: null

