subject_id_col: subject_id

patients_info:
  dob:
    code: "DOB"
    time: $birthdate as "%Y-%m-%d %H:%M:%S.%f"
  dod:
    code: "DOD"
    time: $deathdate as "%Y-%m-%d %H:%M:%S.%f"
  sex:
    code: f"SEX//{$sex}"
    time: null

diagnoser:
  diagnosekode:
    code: f"DIAGNOSIS//{$diagnosekode}"
    time: set_time($dato_slut as '%Y-%m-%d', $tidspunkt_slut as '%H:%M:%S%.f')
  diagnose_type:
    code: f"DIAGNOSIS_TYPE//{$diagnosetype}"
    time: set_time($dato_slut as '%Y-%m-%d', $tidspunkt_slut as '%H:%M:%S%.f')

ekokur:
  medication:
    code: f"MEDICATION//{$code}"
    time: $timestamp as "%Y-%m-%d"

kontakter:
  diagnosis:
    code: f"DIAGNOSIS//{$aktionsdiagnose}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S%.f')
  contact_reason:
    code: f"CONTACT_REASON//{$kontaktaarsag}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S%.f')
  priority:
    code: f"CONTACT_PRIORITY//{$prioritet}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S%.f')
  contact_type:
    code: f"CONTACT_TYPE//{$kontakttype}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S%.f')
  clinical_specialty:
    code: f"CONTACT_SPECIALTY//{$hovedspeciale_ans}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S%.f')
  region_code:
    code: f"REGION//{$region_ans}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S%.f')

laboratorieproevesvar:
  lab_test:
    code: f"LABTEST//{$ANALYSISCODE}"
    time: set_time($SAMPLINGDATE as '%Y-%m-%d', $SAMPLINGTIME as '%H:%M:%S%.f')
    numeric_value: '(extract group 1 of /^\s*([-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?)\s*$/ from $VALUE) as float64'
    text_value: "$VALUE"

procedurer_andre:
  procedure:
    code: f"PROCEDURE//{$procedurekode}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S%.f')
  procedure_type:
    code: f"PROCEDURE_TYPE//{$proceduretype}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S%.f')

procedurer_kirurgi:
  procedure:
    code: f"PROCEDURE//{$procedurekode}"
    time: set_time($dato_start as '%Y-%m-%d', $tidspunkt_start as '%H:%M:%S.%f')

t_adm:
  diagnosis:
    code: f"DIAGNOSIS//{$C_ADIAG}"
    time: set_time($D_INDDTO as '%Y-%m-%d', f"{($V_INDTIME as int)}:{($V_INDMINUT as int)}" as '%H:%M')
  contact_reason:
    code: f"CONTACT_REASON//{$C_KONTAARS}"
    time: set_time($D_INDDTO as '%Y-%m-%d', f"{($V_INDTIME as int)}:{($V_INDMINUT as int)}" as '%H:%M')
  patient_type:
    code: f"CONTACT_PATIENT_TYPE//{$C_PATTYPE}"
    time: set_time($D_INDDTO as '%Y-%m-%d', f"{($V_INDTIME as int)}:{($V_INDMINUT as int)}" as '%H:%M')
  priority:
    code: f"CONTACT_PRIORITY//{$priority}"
    time: set_time($D_INDDTO as '%Y-%m-%d', f"{($V_INDTIME as int)}:{($V_INDMINUT as int)}" as '%H:%M')
  clinical_specialty:
    code: f"CONTACT_SPECIALTY//{$C_SPEC}"
    time: set_time($D_INDDTO as '%Y-%m-%d', f"{($V_INDTIME as int)}:{($V_INDMINUT as int)}" as '%H:%M')
  region_code:
    code: f"REGION//{$C_SGH}"
    time: set_time($D_INDDTO as '%Y-%m-%d', f"{($V_INDTIME as int)}:{($V_INDMINUT as int)}" as '%H:%M')

t_diag:
  diag:
    code: f"DIAGNOSIS//{$C_DIAG}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{($V_UDTIME as int)}:00" as '%H:%M')
  diag_type:
    code: f"DIAGNOSIS_TYPE//{$C_DIAGTYPE}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{($V_UDTIME as int)}:00" as '%H:%M')
  tildiag:
    code: f"DIAGNOSIS//{$C_TILDIAG}"
    time: set_time($D_UDDTO as '%Y-%m-%d', f"{($V_UDTIME as int)}:00" as '%H:%M')

t_sksopr:
  procedure:
    code: f"PROCEDURE//{$C_OPR}"
    time: set_time($D_ODTO as '%Y-%m-%d', f"{(($V_OTIME as float) as int)}:{(($V_OMINUT as float) as int)}" as '%H:%M')

t_sksube:
  procedure:
    code: f"PROCEDURE//{$C_OPR}"
    time: set_time($D_ODTO as '%Y-%m-%d', f"{(($V_OTIME as float) as int)}:{(($V_OMINUT as float) as int)}" as '%H:%M')
  procedure_type:
    code: f"PROCEDURE_TYPE//{coalesce($procedure_type, 'P')}"
    time: set_time($D_ODTO as '%Y-%m-%d', f"{(($V_OTIME as float) as int)}:{(($V_OMINUT as float) as int)}" as '%H:%M')

SP_admissions:
  in:
    code: f"IN//{$Afsnit}"
    time: $Flyt_ind as "%Y-%m-%d %H:%M:%S%.f"
  out:
    code: f"OUT//{$Afsnit}"
    time: $Flyt_ud as "%Y-%m-%d %H:%M:%S%.f"

SP_alcohol_info:
  weekly_drinks:
    code: f"ALCOHOL//{$weekly_drinks}"
    time: $timestamp as "%Y-%m-%d %H:%M:%S.%f"

SP_diagnosis:
  diagnosis:
    code: f"DIAGNOSIS//{$Diagnosekode}"
    time: $timestamp as "%Y-%m-%d %H:%M:%S.%f"

SP_labtest:
  lab_test:
    code: f"LABTEST//{$BestOrd}"
    time: $timestamp as "%Y-%m-%d %H:%M:%S.%f"
    numeric_value: '(extract group 1 of /^\s*([-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?)\s*$/ from $sample_value) as float64'
    text_value: "$sample_value"

SP_medication:
  medication:
    code: f"MEDICATION//{$ATC}"
    time: coalesce($timestamp as '%Y-%m-%d %H:%M:%S.%f', $fill_timestamp as '%Y-%m-%d %H:%M:%S.%f')

SP_procedure:
  procedure:
    code: f"PROCEDURE//{$ProcedureCode}"
    time: $timestamp as "%Y-%m-%d %H:%M:%S.%f"

SP_smoking_info:
  smoking_status:
    code: f"SMOKING//{$Rygestatus}"
    time: $timestamp as "%Y-%m-%d %H:%M:%S.%f"
