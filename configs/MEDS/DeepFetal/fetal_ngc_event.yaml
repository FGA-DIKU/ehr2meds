subject_id_col: subject_id

# Patient demographics
patients_info:
  dob:
    code: DOB
    time: col(birthdate)
  dod:
    code: DOD
    time: col(deathdate)
  sex:
    code:
      - Sex
      - col(sex)
    time: null

# LPR3 diagnoses have no independent timestamp and are conservatively placed
# at contact end, when the diagnosis is known to have been available.
diagnoser:
  diagnosis:
    code:
      - Diagnosis
      - col(diagnosekode)
    time: coalesce($end_timestamp, $start_timestamp)
  diagnose_type:
    code:
      - Diagnosis Type
      - col(diagnosetype)
    time: coalesce($end_timestamp, $start_timestamp)

# Medication from ekokur
ekokur:
  medication:
    code:
      - Medication
      - col(code)
    time: col(timestamp)

# LPR3 action diagnosis is finalized at contact end. Attributes known when the
# contact starts remain at the start timestamp.
kontakter:
  diagnosis:
    code:
      - Diagnosis
      - col(aktionsdiagnose)
    time: coalesce($end_timestamp, $start_timestamp)
  contact_reason:
    code:
      - Contact Reason
      - col(kontaktaarsag)
    time: col(start_timestamp)
  priority:
    code:
      - Contact Priority
      - col(prioritet)
    time: col(start_timestamp)
  contact_type:
    code:
      - Contact Type
      - col(kontakttype)
    time: col(start_timestamp)
  clinical_specialty:
    code:
      - Contact Specialty
      - col(hovedspeciale_ans)
    time: col(start_timestamp)
  region_code:
    code:
      - Region
      - col(region_ans)
    time: col(start_timestamp)

# Keep numeric_value raw here. Split-aware normalization and binning should be
# performed later by aggregate_numeric_metadata and annotate_numeric_values.
laboratorieproevesvar:
  lab_test:
    code:
      - Lab Test
      - col(analysiscode)
    time: col(sample_timestamp)
    numeric_value: col(samplevalue)
    text_value: col(samplevalue)

# LPR3 other procedures
procedurer_andre:
  procedure:
    code:
      - Procedure
      - col(procedurekode)
    time: col(start_timestamp)
  procedure_type:
    code:
      - Procedure Type
      - col(proceduretype)
    time: col(start_timestamp)

# LPR3 surgical procedures
procedurer_kirurgi:
  procedure:
    code:
      - Procedure
      - col(procedurekode)
    time: col(start_timestamp)

# LPR action diagnosis is placed at admission end; start-known attributes stay
# at the admission start timestamp.
t_adm:
  diagnosis:
    code:
      - Diagnosis
      - col(C_ADIAG)
    time: coalesce($end_timestamp, $start_timestamp)
  contact_reason:
    code:
      - Contact Reason
      - col(C_KONTAARS)
    time: col(start_timestamp)
  patient_type:
    code:
      - Patient Type
      - col(C_PATTYPE)
    time: col(start_timestamp)
  priority:
    code:
      - Contact Priority
      - col(priority)
    time: col(start_timestamp)
  clinical_specialty:
    code:
      - Contact Specialty
      - col(C_SPEC)
    time: col(start_timestamp)
  region_code:
    code:
      - Region
      - col(C_SGH)
    time: col(start_timestamp)

# LPR diagnoses likewise inherit the admission end timestamp.
t_diag:
  diag:
    code:
      - Diagnosis
      - col(C_DIAG)
    time: coalesce($end_timestamp, $start_timestamp)
  diag_type:
    code:
      - Diagnosis Type
      - col(C_DIAGTYPE)
    time: coalesce($end_timestamp, $start_timestamp)
  tildiag:
    code:
      - Diagnosis
      - col(C_TILDIAG)
    time: coalesce($end_timestamp, $start_timestamp)

# LPR surgical procedures
t_sksopr:
  procedure:
    code:
      - Procedure
      - col(C_OPR)
    time: col(start_timestamp)

# LPR other procedures
t_sksube:
  procedure:
    code:
      - Procedure
      - col(C_OPR)
    time: col(start_timestamp)
  procedure_type:
    code:
      - Procedure Type
      - col(procedure_type)
    time: col(start_timestamp)

SP_admissions:
  in:
    code:
      - IN
      - col(Afsnit)
    time: col(Flyt_ind)
  out:
    code:
      - OUT
      - col(Afsnit)
    time: col(Flyt_ud)

SP_alcohol_info:
  weekly_drinks:
    code:
      - Alcohol
      - col(weekly_drinks)
    time: col(timestamp)

SP_diagnosis:
  diagnosis:
    code:
      - Diagnosis
      - col(Diagnosekode)
    time: col(timestamp)

SP_labtest:
  lab_test:
    code:
      - Lab Test
      - col(BestOrd)
    time: col(timestamp)
    numeric_value: col(sample_value)
    text_value: col(sample_value)

SP_medication:
  medication:
    code:
      - Medication
      - col(ATC)
    time: coalesce($timestamp, $fill_timestamp)

SP_procedure:
  procedure:
    code:
      - Procedure
      - col(ProcedureCode)
    time: col(timestamp)

SP_smoking_info:
  smoking_status:
    code:
      - Smoking
      - col(Rygestatus)
    time: col(timestamp)

# Line order is fixed in preMEDS via sort_by: [id, line_number] -> row_idx.
SP_notes:
  note:
    code:
      - "Note: NoteType // Specialty // LineNumber"
      - col(note_type)
      - col(specialty)
      - col(line_number)
    time: col(timestamp)
    text_value: col(text)
