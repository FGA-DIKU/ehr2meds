# @package _global_
defaults: 
  - ../root_config@
  - _self_

paths:
  output: ${oc.env:EHR2MEDS_DATA}/raw/fetal_data/SDS_AND_SP_from_population

N: 1000

# Records are dated from the birth they link to in synthetic_coherence (see part1). Mother records run from
# mother_history_days before the pregnancy to mother_followup_days after the birth, child records from the
# birth to child_followup_days after it.
mother_history_days: -730
mother_followup_days: 365
child_followup_days: 730

# Mangler DAR
linked_data: # Data that needs to be linked to the data above
  CPR_immigration:
    N: ${N}
    linked_columns:
      V_PNR:
        type: choice_unique
        file: Population
        linked_on: MOR_CPR
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
              forced_idx: [3]
    columns:
      fodested_kode:
        type: rand_int
        args:
          min_val: 0
          max_val: 900

  kernefamilie:
    N: ${N}
    linked_columns:
      v_pnr:
        type: choice_unique
        file: synthetic_coherence
        linked_on: BABY_CPR
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      v_mor_pnr:
        type: choice_unique
        file: synthetic_coherence
        linked_on: MOR_CPR
        corruptions:
          - type: insert_value
            args:
              new_value: "INVALID"
              probability: 0.05
      v_far_pnr:
        type: choice_unique
        file: synthetic_coherence
        linked_on: father_cpr
        corruptions:
          - type: insert_value
            args:
              new_value: "INVALID"
              probability: 0.05
    columns:
      sosk:
        type: person_id
        corruptions:
          - type: insert_value
            args:
              new_value: "INVALID"
              probability: 0.05
      sosk_type:
        type: rand_int
        args:
          min_val: 1
          max_val: 5

  ivf_behandlingsforloeb:
    N: ${N}
    linked_columns:
      CPRnummer:
        type: choice_unique
        file: synthetic_coherence
        linked_on: MOR_CPR
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      pregnancy_start: {type: choice_unique, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      mother_birthdate: {type: choice_unique, file: synthetic_coherence, linked_on: mother_birthdate, hidden: true}
    columns:
      Transferering_dato: # embryo transfer about two weeks into the pregnancy
        type: date_offset
        match:
          anchor: pregnancy_start
        args:
          min_days: 14
          max_days: 19
          format: "%Y-%m-%d %H:%M:%S.%f"
      Alder_behandlingsstart:
        type: age_at
        match:
          birthdate: mother_birthdate
          date: Transferering_dato
      Graviditet:
        type: choice
        args:
          options: ["Ja", "Nej"]
      Vaegt:
        type: rand_float
        args:
          min_val: 40
          max_val: 120
      Hoejde:
        type: rand_float
        args:
          min_val: 150
          max_val: 200
      Rygning_pr_dag: 
        type: rand_int
        args:
          min_val: 0
          max_val: 30
      Alkohol_pr_dag:
        type: rand_int
        args:
          min_val: 0
          max_val: 30
      Partner_vaegt:
        type: rand_float
        args:
          min_val: 40
          max_val: 120
      Partner_hoejde:
        type: rand_float
        args:
          min_val: 150
          max_val: 200

  epikur:
  #LSR
    N: ${N}
    linked_columns:
      cpr:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    columns:
      eksd:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S"
      ATC:
        type: medical_code
        args:
          prefix: ""
      vnr:
        type: rand_int
        args:
          min_val: 100000
          max_val: 999999

  SSR_GP:
  # Dont know what this is on NGC
    N: ${N}
    linked_columns:
      CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    columns:
      Date:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S"
      Ydelse:
        type: rand_int
        args:
          min_val: 1
          max_val: 5000
      Honuge:
        type: rand_int
        args:
          min_val: 1
          max_val: 52

  amning_afl:
  #BDB
    N: ${N}
    linked_columns:
      CPR:
        type: choice_unique
        file: synthetic_coherence
        linked_on: BABY_CPR
      Fødselstidspunkt: {type: choice_unique, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    columns:
      BIRTHDATE:
        type: date_offset
        match:
          anchor: Fødselstidspunkt
        args:
          format: "%Y-%m-%d %H:%M:%S"
      VARIGHED_DAGE:
        type: rand_int
        args:
          min_val: 0
          max_val: 200
  
  maalinger_afl:
  #BDB
    N: ${N}
    linked_columns:
      CPR:
        type: choice
        file: synthetic_coherence
        linked_on: BABY_CPR
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    columns:
      BIRTHDATE:
        type: date_offset
        match:
          anchor: Fødselstidspunkt
        args:
          format: "%Y-%m-%d %H:%M:%S"
      MEASUREMENTDATE:
        type: date_offset
        match:
          anchor: Fødselstidspunkt
        args:
          max_days: ${child_followup_days}
          format: "%Y-%m-%d %H:%M:%S"
      #MEASUREMENT_TIME:
      #  type: greater_than_datetime
      #  match:
      #    min_date: MEASUREMENT_DATE
      HEIGHT:
        type: rand_float
        args:
          min_val: 50
          max_val: 180
      WEIGHT:
        type: rand_int
        args:
          min_val: 2500
          max_val: 70000

  diagnoser:
  #LPR3
    N: ${N}
    columns:
      diagnosekode:
        type: medical_code
        args:
          prefix: "D"
      diagnosetype:
        type: choice
        args:
          options: ["A", "B", "+"]
    linked_columns:
      dw_ek_kontakt: 
        type: choice
        file: kontakter_all
        linked_on: dw_ek_kontakt
        
    
  lab_dm_forsker_all: # Could also add the lower and upper limits
    N: ${N}
    columns:
      SAMPLINGDATE:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
      SAMPLINGTIME:
        type: rand_timemicroseconds
      ANALYSISCODE:
        type: medical_code
        args:
          prefix: "NPU"
      UNIT:
        type: choice
        args:
          options: ["fl", "mmol/l", "10^9/l", "fmol", "U/L"]
      VALUE:
        type: mix_function
        args:
          functions:
            - type: rand_float 
              args:
                min_val: 0.001
                max_val: 100
            - type: rand_int
              args:
                min_val: 0
                max_val: 300
            - type: choice
              args:
                options: ["Positive", "Negative", "Ikke påvist", "påvist", "0 Rhd pos"]
          probabilities: [0.4, 0.4, 0.2]
    linked_columns:
      PATIENT_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
  procedurer_andre:
  #LPR3
    N: ${N}
    columns:
      tidspunkt_start:
        type: rand_timemicroseconds
      procedurekode:
        type: medical_code
        args:
          prefix: "K"
      proceduretype:
        type: choice
        args:
          options: ["P", "+"]
    linked_columns:
      dw_ek_kontakt:
        type: choice
        file: kontakter_all
        linked_on: dw_ek_kontakt
      dato_start:
        type: choice
        file: kontakter_all
        linked_on: dato_start

  procedurer_kirurgi:
  #LPR3
    N: ${N}
    columns:
      tidspunkt_start:
        type: rand_timemicroseconds
      procedurekode:
        type: medical_code
        args:
          prefix: "K"
      proceduretype:
        type: choice
        args:
          options: ["P", "+"]
    linked_columns:
      dw_ek_kontakt:
        type: choice
        file: kontakter_all
        linked_on: dw_ek_kontakt
      dato_start:
        type: choice
        file: kontakter_all
        linked_on: dato_start

  LPR2_hosp_admissions:
    N: ${N}
    columns:
      D_AMBDTO:
        type: date_offset
        match:
          anchor: D_INDDTO
        args:
          max_days: 1
          format: "%Y-%m-%d %H:%M:%S"
    linked_columns:
      V_RECNUM:
        type: choice
        file: t_adm
        linked_on: K_RECNUM
      D_INDDTO: {type: choice, file: t_adm, linked_on: D_INDDTO, hidden: true}
  
  infektioner:
  #MFR2
    N: ${N}
    columns:
      SKSKODE:
        type: medical_code
        args:
          prefix: "D"
      KODETYPE:
        type: choice
        args:
          options: ["A", "B", "+"]
    linked_columns:
      FK_MFR:
        type: choice
        file: mfr
        linked_on: PK_MFR
        

  graviditetskomplikationer:
    N: ${N}
    columns:
      SKSKODE:
        type: mix_function
        args:
          functions:
            - type: medical_code
              args:
                prefix: "DD"
            - type: choice
              args:
                options: ["DD259", "DD250", "DD250C", "DD251", "DD252", "DD250A", "DD250B", "DO341", "DO3414"]
          probabilities: [0.7, 0.3]
      KODETYPE:
        type: choice
        args:
          options: ["A", "B", "+"]
    linked_columns:
      FK_MFR:
        type: choice
        file: mfr
        linked_on: PK_MFR

  blodmaengde:
  #MFR2
    N: ${N}
    columns:
      SKSKODE:
        type: medical_code
        args:
          prefix: "D"
      KODETYPE:
        type: choice
        args:
          options: ["A", "B", "+"]
      BLOOD_LOSS:
        type: rand_int
        args:
          min_val: 100
          max_val: 2000
        corruptions:
          - type: insert_value
            args:
              new_value: "."
              probability: 0.8
    linked_columns:
      FK_MFR:
        type: choice
        file: mfr
        linked_on: PK_MFR


  barn_kontakter:
  #MFR3 
    N: ${N}
    columns:
      Aktionsdiagnose:
        type: mix_function
        args:
          functions:
            - type: medical_code
              args:
                prefix: "D"
            - type: choice
              args:
                options: ["DP77", "DP271", "DP520", "DP521", "DP522", "DP101", "DP072", "DP073"]
          probabilities: [0.7, 0.3]
      Priority:
        type: choice
        args:
          options: [1, 2, 3]
      Datostart: # neonatal contacts
        type: date_offset
        match:
          anchor: FoedselsDato_Barn
        args:
          max_days: 90
      Tidspunktstart:
        type: rand_time
      Datoslut:
        type: date_offset
        match:
          anchor: Datostart
        args:
          max_days: 7
      Tidspunktslut:
        type: rand_time
      contact_id:
        type: rand_int
        args:
          min_val: 1
          max_val: 600000
    linked_columns:
      DW_EK_Nyfoedt:
        type: choice_unique
        file: nyfoedte
        linked_on: DW_EK_Nyfoedt
      FoedselsDato_Barn: {type: choice_unique, file: nyfoedte, linked_on: FoedselsDato_Barn, hidden: true}

  mor_diagnoser:
  #MFR3 
    N: ${N}
    columns:
      DiagnoseKode:
        type: mix_function
        args:
          functions:
            - type: medical_code
              args:
                prefix: "DD"
            - type: choice
              args:
                options: ["BKHA1", "DD259", "DD250", "DD250C", "DD251", "DD252", "DD250A", "DD250B", "DO341", "DO3414", "DO420", "DO422", "DO424","DO601"]
          probabilities: [0.7, 0.3]
      StartDato_Kontakt: # the last 12 weeks before the birth, always inside the pregnancy
        type: date_offset
        match:
          anchor: FoedselsDato_Barn
        args:
          min_days: -84
          format: "%Y-%m-%d %H:%M:%S"
      DiagnoseType:
        type: choice
        args:
          options: ["A", "B", "+"]
    linked_columns:
      DW_EK_Foedsel:
        type: choice_unique
        file: nyfoedte
        linked_on: DW_EK_Foedsel
      FoedselsDato_Barn: {type: choice_unique, file: nyfoedte, linked_on: FoedselsDato_Barn, hidden: true}

  mor_procedurer:
  #MFR3 
    N: ${N}
    columns:
      ProcedureKode:
        type: mix_function
        args:
          functions:
            - type: medical_code
              args:
                prefix: "DD"
            - type: choice
              args:
                options: ["KLDC00", "KLDC03", "KMCA10D", "KMCA10E"]
          probabilities: [0.7, 0.3]
      StartDato_Procedure: # the last 12 weeks before the birth, always inside the pregnancy
        type: date_offset
        match:
          anchor: FoedselsDato_Barn
        args:
          min_days: -84
    linked_columns:
      DW_EK_Foedsel:
        type: choice_unique
        file: nyfoedte
        linked_on: DW_EK_Foedsel
      FoedselsDato_Barn: {type: choice_unique, file: nyfoedte, linked_on: FoedselsDato_Barn, hidden: true}

  Mor - CPMI - ADT hændelser:
    N: ${N}
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    columns:
      ADT_haendelse:
        type: choice
        args:
          options: ["Indlæggelse", "Flyt_ind", "Tilbage fra orlov"]
      Flyt_ind:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S"
      Flyt_ud:
        type: date_offset
        match:
          anchor: Flyt_ind
        args:
          max_days: 7
          format: "%Y-%m-%d %H:%M:%S"
      Afsnit:
        type: choice
        args:
          options: ["A", "B", "C"]


  Mor - CPMI - Medicin:
    N: ${N}
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    columns:
      Administrationstidspunkt:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S.%f"
      Bestillingsdato:
        type: date_offset
        match:
          anchor: Administrationstidspunkt
        args:
          max_days: 2
          format: "%Y-%m-%d %H:%M:%S.%f"
      ATC:
        type: medical_code
        args:
          prefix: "M"
  
  Mor - CPMI - Prøvesvar:
    N: ${N}
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    columns:
      Prøvetagningstidspunkt:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S.%f"
      BestOrd:
        type: mix_function
        args:
          functions:
            - type: medical_code
              args:
                prefix: "NPU"
            - type: choice
              args:
                options: ["EKG", "KBT", "Blodprøve, UG:2", "Andet", "BT", "COVID", "test;længde", "PAPP A (DOUBLETEST);P", "HCG (DOUBLETEST);P",
                          "Trombocytter", "ALBU, H", "KALIUM;P", "LEUKOCYTTER;B", "ALBUMIN;P", "ELEKTROKARDIOGRAFI [EKG12];PT"]
          probabilities: [0.4, 0.6]
      Resultatdato:
        type: date_offset
        match:
          anchor: Prøvetagningstidspunkt
        args:
          max_days: 7
      Resultatværdi:
        type: mix_function
        args:
          functions:
            - type: rand_float
              args:
                min_val: 0.001
                max_val: 100
            - type: rand_int
              args:
                min_val: 0
                max_val: 300
            - type: choice
              args:
                options: ["Positive", "Negative", "Ikke påvist", "påvist", "0 Rhd pos"]
          probabilities: [0.4, 0.4, 0.2]
      Enhed:
        type: choice
        args:
          options: ["mmol/L", "g/L", "mg/L", "µg/L", "nmol/L", "pmol/L", "x 10^9/L"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.1
      Antibiotika:
        type: choice
        args:
          options: ["Ampicillin", "Cefuroxim", "Gentamicin", "Mecillinam", "Nitrofurantoin", "Sulfamethizol"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.8
      Følsomhed:
        type: choice
        args:
          options: ["S", "I", "R"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.8
      Organisme:
        type: choice
        args:
          options: ["Escherichia coli", "Streptococcus agalactiae (gruppe B)", "Staphylococcus aureus", "Enterococcus faecalis", "Klebsiella pneumoniae"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.8