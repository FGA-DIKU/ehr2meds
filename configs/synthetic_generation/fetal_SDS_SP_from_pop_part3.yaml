# @package _global_
defaults: 
  - ../root_config@
  - _self_

paths:
  output: ${oc.env:EHR2MEDS_DATA}/raw/fetal_data/SDS_AND_SP_from_population

N: 1000

# Records are dated from the birth they link to in synthetic_coherence (see part1). Mother records run from
# mother_history_days before the pregnancy to mother_followup_days after the birth.
mother_history_days: -730
mother_followup_days: 365

linked_data:
  ekokur_all:
    N: ${N}
    columns:
      vnr:
        type: rand_int
        args:
          min_val: 1
          max_val: 10
      eksd:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
      pname:
        type: choice
        args:
          options: ["Dulcolax", "Telefonreceptgebyr"]
    linked_columns:
      cpr:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
      

  epikur_1:
    N: ${N}
    columns:
      atc:
        type: choice
        args:
          options: ["G03DA04", "A06AB02", "S01AA01", "B03AA07", "D01AE15"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      eksd:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
    linked_columns:
      cpr:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  epikur_2:
    N: ${N}
    columns:
      atc:
        type: choice
        args:
          options: ["G03DA04", "A06AB02", "S01AA01", "B03AA07", "D01AE15"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      eksd:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
    linked_columns:
      cpr:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  epikur_3:
    N: ${N}
    columns:
      atc:
        type: choice
        args:
          options: ["G03DA04", "A06AB02", "S01AA01", "B03AA07", "D01AE15"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      eksd:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
    linked_columns:
      cpr:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}


  graviditetskomplikation:
    N: ${N}
    columns:
      SKSKODE:
        type: choice
        args:
          options: ["DZ358Q", "DO144", "DO141", "DO140", "DO139"]
        corruptions:
          - type: insert_nan
            args:
              probability: 0.05
    linked_columns:
      FK_MFR:
        type: choice
        file: mfr
        linked_on: PK_MFR

  igangsaettelse:
    N: ${N}
    columns:
      SKSKODE:
        type: choice
        args:
          options: ["KMAC", "BKHD", "OTHER"]
        corruptions:
          - type: insert_nan
            args:
              probability: 0.05
    linked_columns:
      FK_MFR:
        type: choice
        file: mfr
        linked_on: PK_MFR

  kejsersnit:
    N: ${N}
    columns:
      SKSKODE:
        type: choice
        args:
          options: ["KMCA10A", "KMCARANDOM", "KMCAOTHER", "STUFF"]
        corruptions:
          - type: insert_nan
            args:
              probability: 0.05
    linked_columns:
      FK_MFR:
        type: choice
        file: mfr
        linked_on: PK_MFR

  laegemiddeloplysninger:
    N: ${N}
    columns:
      atc:
        type: choice
        args:
          options: ["G03DA04", "A06AB02", "S01AA01", "B03AA07", "D01AE15"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      pname:
        type: choice
        args:
          options: ["Dulcolax", "Telefonreceptgebyr"]
      vnr:
        type: rand_int
        args:
          min_val: 1
          max_val: 10
    linked_columns:
      cpr:
        type: choice
        file: Population
        linked_on: MOR_CPR
    save_info:
      args:
        sep: "\t"
        encoding: "iso8859-1"

  Mor - Alkohol: 
    N: ${N}
    columns:
      "Alkohol - Antal ugentlige genstande":
        type: rand_int
        args:
          min_val: 0
          max_val: 10
        corruptions:
          - type: insert_nan
            args:
              probability: 0.8
      "Kontakt dato":
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          format: "%Y-%m-%d %H:%M:%S.%f"
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  Mor - CPMI - Diagnoseliste:
    N: ${N}
    columns:
      Diagnosekode:
        type: choice
        args:
          options: ["DS931H","DO837", "DO847","DO420", "DO422", "DO424", "DO601"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      Diagnose:
        type: choice
        args:
          options: ["Normal graviditet, førstegangsfødende (DZ340)", "(kun LPR2) Eet levendefødt barn (DZ370)"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      Noteret_dato:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          end_offset_days: 7
          format: "%Y-%m-%d %H:%M:%S.%f"
      Redigeringsdato:
        type: date_offset
        match:
          anchor: Noteret_dato
        args:
          max_days: 30
          format: "%Y-%m-%d %H:%M:%S.%f"
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  Mor - CPMI - Procedurer:
    N: ${N}
    columns:
      ProcedureCode:
        type: choice
        args:
          options: ["KMCA00", "KMCA96", "KMCA10C", "KMCA30", "BRFAO", "BABZ00", "KMAC00", "KMAC96A", "BKHD2", "BKHD20", "KMCA10D", "KMCA10E"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      ServiceDate:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          end_offset_days: 7
          format: "%Y-%m-%d %H:%M:%S.%f"
      ServiceDatetime:
        type: date_offset
        match:
          anchor: ServiceDate
        args:
          format: "%Y-%m-%d %H:%M:%S.%f"
      ProcedureName:
        type: choice
        args:
          options: ["Kejsersnit", "Akut kejsersnit", "Igangsættelse af fødsel", "Ultralydsscanning", "Amniocentese", "Vakuumekstraktion"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      Beskrivelse:
        type: choice
        args:
          options: ["Udført uden komplikationer", "Planlagt", "Akut", "Se journalnotat"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.3
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}


  Mor - CPMI - Vital parametre:
    N: ${N}
    columns:
      Registreringstidspunkt:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S"
      Værdi:
        type: choice
        args:
          options: ["101/67", "120/80", "110/70", "130/85"]
      Vital_parametre:
        type: choice
        args:
          options: ["BT", "NIBP", "BMI"]
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  Mor - Fødselsresume - DEL 1:
    N: ${N}
    columns:
      "Foetus mortuus ":
        type: choice
        args:
          options: ["Levende", "Død"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.2
      Køn:
        type: choice
        args:
          options: ["Mand", "Kvinde"]
      Måde:
        type: choice
        args:
          options: ["Vaginal, igangsat", "Vaginal, igangsat (Udgået)", "Biokemisk", "Medicinsk behandling", "Elektivt sectio"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      Foster nr.:
        type: choice
        args:
          options: ["Foster 1", "Foster 2", "Foster 3", "Foster 4"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.25
      Placenta dato: # within about an hour of the birth
        type: date_offset
        match:
          anchor: Fødselstidspunkt
        args:
          max_days: 0.05
          format: "%Y-%m-%d %H:%M:%S"
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
    linked_columns:
      MOR_CPR:
        type: choice_unique
        file: synthetic_coherence
        linked_on: MOR_CPR
      Fødselstidspunkt: {type: choice_unique, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
      BABY_Fødsel_ID:
        type: choice_unique
        file: synthetic_coherence
        linked_on: BABY_Fødsel_ID

  Mor - Obstetrisk Historik DEL 1:
    N: ${N}
    columns:
      Flerfold: 
        type: rand_int
        args:
          min_val: 1
          max_val: 4
        corruptions:
          - type: insert_nan
            args:
              probability: 0.6
      Kontakt dato: # booking visit
        type: date_offset
        match:
          anchor: pregnancy_start
        args:
          min_days: 56
          max_days: 98
      Para:
        type: rand_int
        args:
          min_val: 0
          max_val: 5
        corruptions:
          - type: insert_missing
            args:
              probability: 0.15
      Præterm:
        type: rand_int
        args:
          min_val: 0
          max_val: 1
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}

  Mor - Obstetrisk Historik DEL 2:
    N: ${N}
    columns:
      Gestationsalder:
        type: choice
        args:
          options: ["34w0d", "35w0d", "36w0d", "37w0d", "38w0d", "39w0d", "40w0d", "41w0d", "42w0d",
                    "34w6d", "35w6d", "36w6d", "37w6d", "38w6d", "39w6d", "40w6d", "41w6d", "42w6d", 
                    "32w3d", "33w3d", "34w3d", "35w3d", "36w3d", "37w3d", "38w3d", "39w3d", "40w3d", "41w3d", "42w3d"]
      Dato: # an earlier pregnancy, from age 15 to 90 days before this one
        type: date_between
        match:
          start: mother_birthdate
          end: pregnancy_start
        args:
          start_offset_days: 5479
          end_offset_days: -90
      Udfald:
        type: choice
        args:
          options: ["Levendefødt", "Dødfødt", "Spontan abort", "Provokeret abort", "Ekstrauterin graviditet"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.1
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      mother_birthdate: {type: choice, file: synthetic_coherence, linked_on: mother_birthdate, hidden: true}

  Mor - Rygning:
    N: ${N}
    columns:
      Rygestatus: 
        type: choice
        args: 
          options: ["Tidligere", "Nogle dage", "Aldrig"]
      "Kontakt dato":
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          format: "%Y-%m-%d %H:%M:%S.%f"
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  Mor - Patientinfo tillæg til CPMI:
    N: ${N}
    columns:
      "Dato for seneste opdatering":
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S"
      Alkohol - Antal ugentlige genstande: 
        type: rand_int
        args:
          min_val: 0
          max_val: 10
        corruptions:
          - type: insert_nan
            args:
              probability: 0.8
      Rygestatus: 
        type: choice
        args: 
          options: ["Tidligere", "Nogle dage", "Aldrig"]
      Etnicitet:
        type: choice
        args:
          options: ["Unspecified", "Nordeuropa", "Asien", "Mellemøsten"]
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  Mor - Yderligere variable vurderingsskema:
    N: ${N}
    columns:
      Værdi:
        type: mix_function
        args:
          functions:
            - type: rand_float
              args:
                min_val: 0
                max_val: 100
            - type: choice
              args:
                options: [".", "", "<25", ">25", "positive", "negative", "hovedstilling", "Lejeændring;STAN;HSP"]
          probabilities: [0.9, 0.1]
      Registrering:
        type: choice
        args:
          options: ["Cervix i mm", "Handlinger"]
      Registreringstidspunkt:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          format: "%Y-%m-%d %H:%M:%S"
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  notes:
    N: ${N}
    columns:
      Linjenummer:
        type: rand_int
        args:
          min_val: 1
          max_val: 10
      Redigeringstidspunkt:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S"
      Notetype:
        type: choice
        args:
          options: ["Opfølgning", "Indlæggelse", "Operation"]
      Speciale:
        type: choice
        args:
          options: ["Nefrologi", "Gastroenterologi", "Kardiologi", "Endokrinologi", "Nervensundhed", "Andet"]
        corruptions:
          - type: insert_nan
            args:
              probability: 0.05
      note:
        type: rand_string
        args:
          min_length: 10
          max_length: 3000
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}

  t_afl:
    N: ${N}
    columns:
      C_TILOPR:
        type: choice
        args:
          options: ["KLDD10A", "KLDD10B", "KMAB00", "KMAB01", "KLDD20", "KMAB03","KMCA10D", "KMCA10E"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.1
      D_ODTO:
        type: date_offset
        match:
          anchor: D_INDDTO
        args:
          max_days: 3
          format: "%Y-%m-%d %H:%M:%S"
    linked_columns:
      V_RECNUM:
        type: choice
        file: t_adm
        linked_on: K_RECNUM
      D_INDDTO: {type: choice, file: t_adm, linked_on: D_INDDTO, hidden: true}

  t_diag:
    N: ${N}
    columns:
      C_DIAG:
        type: choice
        args:
          options: ["DZ016", "DZ090","DO343C", "DO420", "DO422", "DO424","DO601"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      C_DIAGTYPE:
        type: choice
        args:
          options: ["A", "B", "+"]
      C_TILDIAG:
        type: choice
        args:
          options: ["KNDJ73", "DO702", "DQ531"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.80
    linked_columns:
      V_RECNUM:
        type: choice
        file: t_adm
        linked_on: K_RECNUM
      D_UDDTO:
        type: choice
        file: t_adm
        linked_on: D_UDDTO

  t_sksopr:
    N: ${N}
    columns:
      C_OPR:
        type: choice
        args:
          options: ["KLDD10A", "KLDD10B", "KMAB00", "KMAB01", "KCKD05B", "KMCA10A", "KMCARANDOM", "KMCAOTHER", "STUFF"]
        corruptions:
          - type: insert_nan
            args:
              probability: 0.05
      C_TILOPR:
        type: choice
        args:
          options: ["KLDD10A", "KLDD10B", "KMAB00", "KMAB01", "KCKD05B", "KMCA10A", "KMCARANDOM", "KMCAOTHER", "STUFF"]
        corruptions:
          - type: insert_nan
            args:
              probability: 0.05
      D_ODTO:
        type: date_offset
        match:
          anchor: D_INDDTO
        args:
          max_days: 3
      V_OTIME:
        type: rand_int
        args:
          min_val: 0
          max_val: 23
      V_OMINUT:
        type: rand_int
        args:
          min_val: 0
          max_val: 59
    linked_columns:
      V_RECNUM:
        type: choice
        file: t_adm
        linked_on: K_RECNUM
      D_INDDTO: {type: choice, file: t_adm, linked_on: D_INDDTO, hidden: true}

  t_sksube:
    N: ${N}
    columns:
      C_OPR:
        type: choice
        args:
          options: ["AAF22", "ZZ0151"]
      C_OPRART:
        type: choice
        args:
          options: ["A", "B", "+"]
      C_TILOPR:
        type: choice
        args:
          options: ["BKHA1", "APBA1"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.25
      D_ODTO:
        type: date_offset
        match:
          anchor: D_INDDTO
        args:
          max_days: 3
      V_OTIME:
        type: rand_int
        args:
          min_val: 0
          max_val: 23
      V_OMINUT:
        type: rand_int
        args:
          min_val: 0
          max_val: 59
    linked_columns:
      V_RECNUM:
        type: choice
        file: t_adm
        linked_on: K_RECNUM
      D_INDDTO: {type: choice, file: t_adm, linked_on: D_INDDTO, hidden: true}
  Mor - CPMI - Notater:
    N: ${N}
    columns:
      Oprettelsestidspunkt:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
          format: "%Y-%m-%d %H:%M:%S.%f"
      Notetype:
        type: choice
        args:
          options: ["Journalnotat", "Ambulant notat", "Fødselsjournal", "Epikrise", "Telefonnotat"]
      Speciale:
        type: choice
        args:
          options: ["Obstetrik", "Gynækologi", "Anæstesiologi", "Neonatologi"]
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      Note:
        type: rand_string
        args:
          min_length: 20
          max_length: 300
          include_digits: False
    linked_columns:
      MOR_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
