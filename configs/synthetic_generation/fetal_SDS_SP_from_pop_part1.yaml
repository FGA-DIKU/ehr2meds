# @package _global_
defaults: 
  - ../root_config@
  - _self_

paths:
  output: ${oc.env:EHR2MEDS_DATA}/raw/fetal_data/SDS_AND_SP_from_population

N: 1000
N_population: 1500

# Records are dated from the birth they link to in synthetic_coherence. Mother records run from
# mother_history_days before the pregnancy (pregnancy_start) to mother_followup_days after the birth
# (Fødselstidspunkt).
mother_history_days: -730
mother_followup_days: 365

data:
  Population:
    N: ${N_population}
    columns:
      BABY_CPR:
        type: person_id
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      MOR_CPR:
        type: person_id
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      BABY_Fødsel_ID:
        type: person_id
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      MOR_Fødsel_ID:
        type: person_id
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      Fødselstidspunkt:
        type: rand_datetimeseconds

# Linked columns that read the same file come from the same row of it. Columns with hidden: true are only
# used to date the other columns and are not saved.
linked_data:
  # Not a real table. It only exists to keep the synthetic tables coherent: one row per Population birth, with
  # that birth's IDs plus the father, GA, pregnancy start and mother's birth date. Tables that need more than
  # one fact about a birth link here, so their CPRs, dates, GA and ages all come from the same birth.
  synthetic_coherence:
    N: ${N_population}
    linked_columns:
      BABY_CPR:
        type: choice_unique
        file: Population
        linked_on: BABY_CPR
      MOR_CPR:
        type: choice_unique
        file: Population
        linked_on: MOR_CPR
      BABY_Fødsel_ID:
        type: choice_unique
        file: Population
        linked_on: BABY_Fødsel_ID
      MOR_Fødsel_ID:
        type: choice_unique
        file: Population
        linked_on: MOR_Fødsel_ID
      Fødselstidspunkt:
        type: choice_unique
        file: Population
        linked_on: Fødselstidspunkt
    columns:
      father_cpr:
        type: person_id
      ga_days:
        type: mix_function
        args:
          functions:
            - type: rand_int # term
              args:
                min_val: 259
                max_val: 293
            - type: rand_int # preterm
              args:
                min_val: 154
                max_val: 258
            - type: rand_int # post-term
              args:
                min_val: 294
                max_val: 300
          probabilities: [0.8, 0.15, 0.05]
      pregnancy_start:
        type: days_before
        match:
          anchor: Fødselstidspunkt
          days: ga_days
        args:
          format: "%Y-%m-%d %H:%M:%S.%f"
      mother_birthdate: # mother aged 18-44 at the birth
        type: date_offset
        match:
          anchor: Fødselstidspunkt
        args:
          min_days: -16070
          max_days: -6575
          format: "%Y-%m-%d %H:%M:%S.%f"

  Barn - Fødselsinfo:
    N: ${N}
    linked_columns:
      BABY_CPR:
        type: choice_unique
        file: synthetic_coherence
        linked_on: BABY_CPR
      ga_days: {type: choice_unique, file: synthetic_coherence, linked_on: ga_days, hidden: true}
    columns:
      Gestationsalder:
        type: gestationsalder_with_fraction
        match:
          ga_days: ga_days
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05  

  kontakter_all: 
  #LPR3
    N: ${N}
    linked_columns:
      cpr:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    corruptions:
      - type: row_dropout
        args:
          probability: 0.05
          forced_idx: [5, 10]
    columns:
      aktionsdiagnose:
        type: medical_code
        args:
          prefix: "D"
      dato_start:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
      dato_slut:
        type: date_offset
        match:
          anchor: dato_start
        args:
          max_days: 7
      dw_ek_forloeb: 
        type: rand_int
        args:
          min_val: 1
          max_val: 600000    
      dw_ek_kontakt:
        type: person_id
        corruptions:
          - type: truncation
            args:
              max_length: 5
              probability: 0.05
              forced_idx: [3]
      kontaktaarsag:
        type: choice
        args:
          options: ["Ukendt"]
      kontakttype:
        type: choice
        args:
          options: ["Ukendt"]
      hovedspeciale_ans:
        type: choice
        args:
          options: ["børne- og ungdomspsykiatri"]
      region_ans:
        type: choice
        args:
          options: ["1082"]
      prioritet: # urgency
        type: choice
        args:
          options: [1, 2, 3]
      tidspunkt_start:
        type: rand_timemicroseconds
        corruptions:
          - type: insert_value
            args:
              new_value: "."
              probability: 0.05
      tidspunkt_slut:
        type: rand_timemicroseconds



  mfr:
    N: ${N}
    columns:
      ALDER_MODER:
        type: age_at
        match:
          birthdate: mother_birthdate
          date: Fødselstidspunkt
      BMI_MODER:
        type: rand_float
        args:
          min_val: 18
          max_val: 40
      FLERFOLDSGRAVIDITET:
        type: choice
        args:
          options: ["DO30A", "DO30B", "OTHER"]
      KOEN_BARN:
        type: choice
        args:
          options: ["K", "M"]
      PK_MFR:
        type: person_id
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      PPROM:
        type: choice
        args:
          options: ["DO4", "Other", "DO422"]
      VAEGTE_MODER:
        type: rand_float
        args:
          min_val: 40
          max_val: 120
      PARITET:
        type: choice
        args:
          options: [1, 2, 3, 4]
      FOEDSELSDATO:
        type: date_offset
        match:
          anchor: Fødselstidspunkt
      FOEDSELSAAR:
        type: date_offset
        match:
          anchor: Fødselstidspunkt
        args:
          format: "%Y"
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      LEVENDE_ELLER_DOEDFOEDT:
        type: choice
        args:
          options: ["Levendefødt", "Dødfødt"]
      MARKOER_IGANGSAETTELSE:
        type: choice
        args:
          options: [1, ""]
      MARKOER_KEJSERSNIT:
        type: medical_code
        args:
          prefix: "KM"
        corruptions:
          - type: insert_value
            args:
              new_value: -1
              probability: 0.5
    linked_columns:
      CPR_BARN:
        type: choice_unique
        file: synthetic_coherence
        linked_on: BABY_CPR
        corruptions:
          - type: insert_value
            args:
              new_value: "INVALID"
              probability: 0.05
      CPR_MODER:
        type: choice_unique
        file: synthetic_coherence
        linked_on: MOR_CPR
        corruptions:
          - type: insert_value
            args:
              new_value: "INVALID"
              probability: 0.05
      CPR_FADER:
        type: choice_unique
        file: synthetic_coherence
        linked_on: father_cpr
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      FOEDSELSLOEBENUMMER:
        type: choice_unique
        file: synthetic_coherence
        linked_on: MOR_Fødsel_ID
      GESTATIONSALDER_DAGE:
        type: choice_unique
        file: synthetic_coherence
        linked_on: ga_days
        corruptions:
          - type: insert_value
            args:
              new_value: "."
              probability: 0.05
      Fødselstidspunkt: {type: choice_unique, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
      mother_birthdate: {type: choice_unique, file: synthetic_coherence, linked_on: mother_birthdate, hidden: true}

  Mor - CPMI - Patientinfo:
    N: ${N_population}
    linked_columns:
      MOR_CPR:
        type: choice_unique
        file: synthetic_coherence
        linked_on: MOR_CPR
      Fødselsdato:
        type: choice_unique
        file: synthetic_coherence
        linked_on: mother_birthdate
      Fødselstidspunkt: {type: choice_unique, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
    columns:
      Køn:
        type: choice
        args:
          options: ["Kvinde"]
      Dødsdato: # after the mother's last record
        type: date_offset
        match:
          anchor: Fødselstidspunkt
        args:
          min_days: ${mother_followup_days}
          max_days: 730
          format: "%Y-%m-%d %H:%M:%S.%f"
        corruptions:
          - type: insert_nan
            args:
              probability: 0.8
  nyfoedte:
  #MFR3
    N: ${N}
    columns:
      Alder_Mor:
        type: age_at
        match:
          birthdate: mother_birthdate
          date: Fødselstidspunkt
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      AntalBoernIFoedslen:
        type: choice
        args:
          options: [0, 1, 2, 3, 4]
      AntalDoedFoedte:
        type: choice
        args:
          options: [0, 1, 2]
      AntalLevendefoedte:
        type: choice
        args:
          options: [0, 1, 2]
      BMI_Mor:
        type: rand_float
        args:
          min_val: 18
          max_val: 40
      DW_EK_Nyfoedt:
        type: person_id
        corruptions:
          - type: truncation
            args:
              max_length: 10
              probability: 0.05
      FoedselsDato_Barn:
        type: date_offset
        match:
          anchor: Fødselstidspunkt
      FoedselsAar:
        type: date_offset
        match:
          anchor: Fødselstidspunkt
        args:
          format: "%Y"
        corruptions:
          - type: insert_missing
            args:
              probability: 0.05
      Hoejde_Mor:
        type: rand_float
        args:
          min_val: 150
          max_val: 200
      Igangsaettelse_Ballonkateter:
        type: choice
        args:
          options: ["Nej", "Ja"]
      Igangsaettelse_HSP:
        type: choice
        args:
          options: ["Nej", "Ja"]
      Igangsaettelse_Medicinsk:
        type: choice
        args:
          options: ["Nej", "Ja"]
      Koen_Barn:
        type: choice
        args:
          options: ["K", "M"]
      Kejsersnit:
        type: medical_code
        args:
          prefix: "KM"
        corruptions:
          - type: insert_value
            args:
              new_value: -1
              probability: 0.5
      Laengde_Barn:
        type: rand_float
        args:
          min_val: 150
          max_val: 200
      LevendefoedtDoedfoedt:
        type: choice
        args:
          options: [1, 2]
      Paritet:
        type: choice
        args:
          options: [1, 2, 3, 4]
      Tobak_forbrug:
        type: medical_code
        corruptions:
          - type: insert_value
            args:
              new_value: -1
              probability: 0.05
      Vaegt_Mor:
        type: rand_float
        args:
          min_val: 40
          max_val: 120
      Vaegt_Barn:
        type: rand_float
        args:
          min_val: 40
          max_val: 120
    linked_columns:
      CPRnummer_Barn:
        type: choice_unique
        file: synthetic_coherence
        linked_on: BABY_CPR
        corruptions:
          - type: insert_value
            args:
              new_value: "INVALID"
              probability: 0.05
      CPRnummer_Mor:
        type: choice_unique
        file: synthetic_coherence
        linked_on: MOR_CPR
        corruptions:
          - type: insert_value
            args:
              new_value: "INVALID"
              probability: 0.05
      DW_EK_Foedsel:
        type: choice_unique
        file: synthetic_coherence
        linked_on: BABY_Fødsel_ID
      Gestationsalder:
        type: choice_unique
        file: synthetic_coherence
        linked_on: ga_days
        corruptions:
          - type: insert_value
            args:
              new_value: "."
              probability: 0.05
      Fødselstidspunkt: {type: choice_unique, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
      mother_birthdate: {type: choice_unique, file: synthetic_coherence, linked_on: mother_birthdate, hidden: true}

  t_adm:
    N: ${N}
    columns:
      C_ADIAG:
        type: medical_code
        args:
          prefix: "D"
      C_KONTAARS:
        type: rand_int
        args:
          min_val: 2010
          max_val: 2023
      C_PATTYPE:
        type: rand_int
        args:
          min_val: 1
          max_val: 3
      C_INDM:
        type: choice
        args:
          options: ["1", "2", "3"]
      C_SPEC:
        type: rand_int
        args:
          min_val: 1
          max_val: 100
      C_SGH:
        type: rand_int
        args:
          min_val: 1
          max_val: 10
      K_RECNUM:
        type: person_id
      D_INDDTO:
        type: date_between
        match:
          start: pregnancy_start
          end: Fødselstidspunkt
        args:
          start_offset_days: ${mother_history_days}
          end_offset_days: ${mother_followup_days}
      D_UDDTO:
        type: date_offset
        match:
          anchor: D_INDDTO
        args:
          max_days: 14
        corruptions:
          - type: insert_value
            args:
              new_value: "."
              probability: 0.15
      V_ALDER:
        type: age_at
        match:
          birthdate: mother_birthdate
          date: D_INDDTO
      V_INDTIME:
        type: rand_int
        args:
          min_val: 0
          max_val: 23
        corruptions:
          - type: insert_value
            args:
              new_value: "."
              probability: 0.15
      V_UDTIME:
        type: rand_int
        args:
          min_val: 0
          max_val: 23
        corruptions:
          - type: insert_value
            args:
              new_value: "."
              probability: 0.15
      V_INDMINUT:
        type: rand_int
        args:
          min_val: 0
          max_val: 59
    linked_columns:
      V_CPR:
        type: choice
        file: synthetic_coherence
        linked_on: MOR_CPR
      pregnancy_start: {type: choice, file: synthetic_coherence, linked_on: pregnancy_start, hidden: true}
      Fødselstidspunkt: {type: choice, file: synthetic_coherence, linked_on: Fødselstidspunkt, hidden: true}
      mother_birthdate: {type: choice, file: synthetic_coherence, linked_on: mother_birthdate, hidden: true}
